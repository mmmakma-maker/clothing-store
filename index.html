<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر</title>

<style>
/* ===== الأساس ===== */
body{
  margin:0;
  font-family: 'Segoe UI', Tahoma;
  background:#f5f5f5;
}

/* ===== الحاوية ===== */
.container{
  padding:15px;
  padding-bottom:90px;
}

/* ===== التبويبات العلوية ===== */
.top-tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:10px;
}
.top-tabs button{
  border:none;
  padding:8px 16px;
  border-radius:20px;
  background:#eee;
  font-size:14px;
}
.top-tabs .active{
  background:#000;
  color:#fff;
}

/* ===== البحث ===== */
.search-bar input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:10px;
}

/* ===== تصنيف / تصفية ===== */
.sort-filter-bar{
  display:flex;
  justify-content:space-around;
  background:#222;
  color:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}
.sort-filter-bar button{
  background:none;
  border:none;
  color:white;
  font-size:14px;
}

/* ===== المنتجات ===== */
.products{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.product{
  width:48%;
  background:white;
  border-radius:15px;
  padding:10px;
  position:relative;
}
.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}
.heart{
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  border-radius:50%;
  padding:6px;
}
.product h4{
  margin:8px 0 5px;
  font-size:14px;
}
.price{
  font-weight:bold;
}
.add-btn{
  width:100%;
  margin-top:5px;
  border:none;
  padding:8px;
  background:#ff5722;
  color:white;
  border-radius:20px;
}

/* ===== السلة ===== */
.cart-popup{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  width:90%;
  max-width:350px;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:2000;
}
.cart-popup ul{
  list-style:none;
  padding:0;
}
.cart-popup li{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

/* ===== شريط سفلي ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #ddd;
}
.bottom-nav button{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:14px;
}

/* ===== تنبيه ===== */
#toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  display:none;
}
</style>
</head>

<body>

<div class="container">

  <!-- التبويبات -->
  <div class="top-tabs">
    <button class="active">بريميوم</button>
    <button>المنزل وأكثر</button>
    <button>الأطفال</button>
  </div>

  <!-- البحث -->
  <div class="search-bar">
    <input type="text" id="search" placeholder="ابحث">
  </div>

  <!-- تصنيف / تصفية -->
  <div class="sort-filter-bar">
    <button onclick="showToast('التصنيف قريباً')">⇅ تصنيف</button>
    <button onclick="showToast('التصفية قريباً')">☰ تصفية</button>
  </div>

  <!-- المنتجات -->
  <div class="products" id="products"></div>

</div>

<!-- السلة -->
<div class="cart-popup" id="cartPopup">
  <h3>سلة التسوق</h3>
  <ul id="cartList"></ul>
  <button onclick="cartPopup.style.display='none'">إغلاق</button>
</div>

<!-- الشريط السفلي -->
<div class="bottom-nav">
  <button>🏠<span>الرئيسية</span></button>
  <button>📂<span>الفئات</span></button>
  <button>🔥<span>تخفيضات</span></button>
  <button onclick="openCart()">🛒<span>السلة</span></button>
  <button>👤<span>حسابي</span></button>
</div>

<div id="toast"></div>

<script>
const productsData=[
 {name:"فستان سهرة",price:81.93,img:"https://i.imgur.com/0y8Ftya.jpg"},
 {name:"فستان أسود",price:60.79,img:"https://i.imgur.com/mP7a7bU.jpg"},
 {name:"فستان وردي",price:74.50,img:"https://i.imgur.com/Yx8FqPz.jpg"},
 {name:"فستان مطرز",price:92.00,img:"https://i.imgur.com/7pG9x0k.jpg"}
];

let cart=[];

const productsDiv=document.getElementById("products");
const cartPopup=document.getElementById("cartPopup");
const cartList=document.getElementById("cartList");

function renderProducts(list){
 productsDiv.innerHTML="";
 list.forEach(p=>{
  productsDiv.innerHTML+=`
   <div class="product">
    <div class="heart">♡</div>
    <img src="${p.img}">
    <h4>${p.name}</h4>
    <div class="price">${p.price} ر.ع</div>
    <button class="add-btn" onclick='addToCart("${p.name}",${p.price})'>أضف للسلة</button>
   </div>
  `;
 });
}

function addToCart(name,price){
 cart.push({name,price});
 showToast("تمت الإضافة للسلة");
}

function openCart(){
 cartList.innerHTML="";
 cart.forEach(i=>{
  cartList.innerHTML+=`<li>${i.name}<span>${i.price}</span></li>`;
 });
 cartPopup.style.display="block";
}

function showToast(msg){
 const t=document.getElementById("toast");
 t.innerText=msg;
 t.style.display="block";
 setTimeout(()=>t.style.display="none",2000);
}

renderProducts(productsData);
</script>

</body>
</html>
