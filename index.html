<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>متجر الملابس</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===================== BODY ===================== */
body{
  margin:0;
  font-family:'Segoe UI', Tahoma;
  background:#f5f5f5;
}

/* ===================== CONTAINER ===================== */
.container{
  width:90%;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:15px;
  position:relative;
  z-index:1;
}

/* ===================== SEARCH ===================== */
#search{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:15px;
}

/* ===================== PRODUCTS ===================== */
.products{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  justify-content:center;
}

.product{
  width:200px;
  background:#fff0f5;
  padding:10px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.product img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
}

.product button{
  margin-top:5px;
}

/* ===================== BUTTONS ===================== */
button{
  background:#ff5722;
  color:white;
  border:none;
  padding:8px 15px;
  border-radius:20px;
  cursor:pointer;
}

button:disabled{
  background:#ccc;
  cursor:not-allowed;
}

/* ===================== PRODUCT DETAIL ===================== */
.product-detail{
  display:none;
  text-align:center;
  position:relative;
  z-index:2;
}

.product-detail img{
  width:250px;
  border-radius:15px;
  cursor:pointer;
}

/* ===================== CART BUTTON ===================== */
#cartButton{
  position:fixed;
  top:10px;
  left:10px;
  background:#000;
  color:white;
  padding:12px 16px;
  border-radius:50px;
  z-index:3000;
}

/* ===================== CART POPUP ===================== */
.cart-popup{
  display:none;
  position:fixed;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  width:320px;
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
  z-index:2000;
}

.cart-popup ul{
  list-style:none;
  padding:0;
}

/* ===================== TOAST ===================== */
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  display:none;
  z-index:4000;
}
</style>
</head>

<body>

<button id="cartButton">🛒 السلة (<span id="cartCount">0</span>)</button>

<div class="container">

  <input type="text" id="search" placeholder="ابحث عن منتج">

  <div id="products" class="products"></div>

  <div id="productDetail" class="product-detail"></div>

</div>

<!-- CART -->
<div id="cartPopup" class="cart-popup">
  <h3>سلة التسوق</h3>
  <ul id="cartList"></ul>
  <p id="cartTotal"></p>
  <button onclick="closeCart()">إغلاق</button>
</div>

<div id="toast"></div>

<script>
/* ===================== DATA ===================== */
const products=[
 {id:1,name:"فستان أسود",price:80,stock:5,img:"https://i.imgur.com/mP7a7bU.jpg"},
 {id:2,name:"فستان وردي",price:95,stock:3,img:"https://i.imgur.com/Yx8FqPz.jpg"},
 {id:3,name:"فستان سهرة",price:120,stock:2,img:"https://i.imgur.com/7pG9x0k.jpg"}
];

let cart=[];

/* ===================== DOM ===================== */
const productsDiv=document.getElementById("products");
const detailDiv=document.getElementById("productDetail");
const cartPopup=document.getElementById("cartPopup");
const cartList=document.getElementById("cartList");
const cartTotal=document.getElementById("cartTotal");
const cartCount=document.getElementById("cartCount");
const toast=document.getElementById("toast");

/* ===================== FUNCTIONS ===================== */
function showToast(msg){
 toast.textContent=msg;
 toast.style.display="block";
 setTimeout(()=>toast.style.display="none",2000);
}

function renderProducts(list){
 productsDiv.innerHTML="";
 detailDiv.style.display="none";
 productsDiv.style.display="flex";

 list.forEach(p=>{
  const div=document.createElement("div");
  div.className="product";
  div.innerHTML=`
   <img src="${p.img}" onclick="zoomImage('${p.img}')">
   <h4>${p.name}</h4>
   <p>${p.price} ريال</p>
   <p>المتبقي: ${p.stock}</p>
   <button onclick="showDetail(${p.id})" ${p.stock===0?"disabled":""}>عرض</button>
  `;
  productsDiv.appendChild(div);
 });
}

function showDetail(id){
 const p=products.find(x=>x.id===id);
 productsDiv.style.display="none";
 detailDiv.style.display="block";
 detailDiv.innerHTML=`
  <h2>${p.name}</h2>
  <img src="${p.img}" onclick="zoomImage('${p.img}')">
  <p>${p.price} ريال</p>
  <input type="number" id="qty" min="1" max="${p.stock}" value="1">
  <br><br>
  <button onclick="addToCart(${p.id})">أضف للسلة</button>
  <button onclick="renderProducts(products)">رجوع</button>
 `;
}

function addToCart(id){
 const p=products.find(x=>x.id===id);
 const qty=parseInt(document.getElementById("qty").value);
 if(qty<1 || qty>p.stock) return showToast("كمية غير صحيحة");
 cart.push({id:p.id,name:p.name,price:p.price,qty});
 p.stock-=qty;
 updateCart();
 renderProducts(products);
 showToast("تمت الإضافة للسلة");
}

function updateCart(){
 cartList.innerHTML="";
 let total=0;
 cart.forEach(i=>{
  cartList.innerHTML+=`<li>${i.name} x${i.qty} - ${i.price*i.qty} ريال</li>`;
  total+=i.price*i.qty;
 });
 cartTotal.textContent="المجموع: "+total+" ريال";
 cartCount.textContent=cart.reduce((s,i)=>s+i.qty,0);
}

document.getElementById("cartButton").onclick=()=>{
 updateCart();
 cartPopup.style.display="block";
};

function closeCart(){
 cartPopup.style.display="none";
}

/* ===================== SEARCH ===================== */
document.getElementById("search").addEventListener("input",e=>{
 const v=e.target.value.toLowerCase();
 renderProducts(products.filter(p=>p.name.toLowerCase().includes(v)));
});

/* ===================== ZOOM IMAGE (FIXED) ===================== */
function zoomImage(src){
 const z=document.createElement("div");
 z.style.position="fixed";
 z.style.top=0;
 z.style.left=0;
 z.style.width="100%";
 z.style.height="100%";
 z.style.background="rgba(0,0,0,.8)";
 z.style.display="flex";
 z.style.alignItems="center";
 z.style.justifyContent="center";
 z.style.zIndex="9999";
 z.innerHTML=`<img src="${src}" style="max-width:90%;max-height:90%;border-radius:15px;">`;
 z.onclick=()=>z.remove();
 document.body.appendChild(z);
}

/* ===================== INIT ===================== */
renderProducts(products);
</script>

</body>
</html>
