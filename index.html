<style>
body{margin:0;font-family: 'Segoe UI', Tahoma;background:#f5f5f5;}
.container{padding:15px;padding-bottom:90px;}
.top-tabs{display:flex;gap:10px;overflow-x:auto;margin-bottom:10px;}
.top-tabs button{border:none;padding:8px 16px;border-radius:20px;background:#eee;font-size:14px;cursor:pointer;}
.top-tabs .active{background:#000;color:#fff;}
#offerBar{display:flex;align-items:center;gap:10px;padding:10px;background:#ffcc00;color:#000;font-weight:bold;border-radius:5px;margin-bottom:10px;}
#offerBar #offerContent{display:flex;align-items:center;overflow:hidden;flex:1;}
#offerBar img{height:50px;border-radius:5px;margin-right:10px;}
#offerBar span{white-space:nowrap;}
#offerBar button{border:none;background:none;font-weight:bold;cursor:pointer;font-size:18px;}
#cartSummary{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#ff5722;color:white;font-weight:bold;border-radius:5px;margin-bottom:10px;cursor:pointer;}
.search-bar input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin-bottom:10px;}
.sort-filter-bar{display:flex;justify-content:space-around;background:#222;color:white;padding:10px;border-radius:10px;margin-bottom:15px;}
.sort-filter-bar button{background:none;border:none;color:white;font-size:14px;}
.products{display:flex;flex-wrap:wrap;gap:10px;}
.product{width:48%;background:white;border-radius:15px;padding:10px;position:relative;}
.product img{width:100%;height:220px;object-fit:cover;border-radius:10px;}
.heart{position:absolute;top:10px;left:10px;background:white;border-radius:50%;padding:6px;cursor:pointer;}
.product h4{margin:8px 0 5px;font-size:14px;}
.price{font-weight:bold;}
.add-btn{width:100%;margin-top:5px;border:none;padding:8px;background:#ff5722;color:white;border-radius:20px;cursor:pointer;}
.cart-popup, #authPopup, #adminLogin, #adminPanel, #paymentPopup{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:white;width:90%;max-width:350px;max-height:80vh;border-radius:15px;padding:15px;display:none;z-index:2000;overflow-y:auto;}
.cart-popup ul, #authPopup ul{list-style:none;padding:0;}
.cart-popup li{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.cart-item-controls{display:flex;gap:5px;align-items:center;}
.cart-item-controls button{padding:2px 6px;border:none;border-radius:5px;background:#ff5722;color:white;cursor:pointer;}
.cart-total{font-weight:bold;margin-top:10px;text-align:right;}
.bottom-nav{position:fixed;bottom:0;width:100%;height:65px;background:white;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #ddd;}
.bottom-nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;font-size:14px;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 20px;border-radius:20px;display:none;}
#authPopup input{width:100%;padding:8px;margin-bottom:8px;border-radius:5px;border:1px solid #ccc;}
#authPopup button, #adminPanel button, #adminLogin button{width:100%;padding:8px;background:#ff5722;color:white;border:none;border-radius:5px;cursor:pointer;margin-bottom:5px;}
#authPopup p{text-align:center;margin-top:8px;cursor:pointer;color:#007bff;}
#adminPanel input, #adminPanel select{width:100%;padding:5px;margin-bottom:5px;border-radius:5px;border:1px solid #ccc;}
#paymentPopup input{width:100%;padding:8px;margin-bottom:5px;border-radius:5px;border:1px solid #ccc;}
#paymentPopup button{width:100%;padding:8px;background:#ff5722;color:white;border:none;border-radius:5px;margin-bottom:5px;cursor:pointer;}
.popup-close{position:absolute;top:12px;right:12px;background:#f2f2f2;border:none;font-size:16px;cursor:pointer;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#555;transition:0.2s;}
.popup-close:hover{background:#ff5722;color:white;}
</style>

<script>
// ---------------- البيانات الأساسية ----------------
let productsData = JSON.parse(localStorage.getItem("products")) || [
  {name:"عباية عمانية سوداء",price:80,img:"https://i.imgur.com/0y8Ftya.jpg",category:"omani"},
  {name:"فستان بلوشي مطرز",price:95,img:"https://i.imgur.com/Yx8FqPz.jpg",category:"blushi"},
  {name:"قطعة بلوشية",price:40,img:"https://i.imgur.com/1bX5QH6.jpg",category:"pieces"}
];
function saveProducts(){ localStorage.setItem("products", JSON.stringify(productsData)); }

const categoryOffers={
  omani:{text:"عرض اليوم: خصم 10% على جميع العباءات العمانية!",img:"https://i.imgur.com/0y8Ftya.jpg"},
  blushi:{text:"عرض اليوم: فستان بلوشي مطرز بسعر خاص!",img:"https://i.imgur.com/Yx8FqPz.jpg"},
  pieces:{text:"عرض اليوم: قطعة بلوشية إضافية عند شراء أي منتج!",img:"https://i.imgur.com/1bX5QH6.jpg"}
};

let cart=[];
let currentCategory="omani";
let currentUser = JSON.parse(localStorage.getItem("currentUser")) || null;
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

const productsDiv=document.getElementById("products");
const cartPopup=document.getElementById("cartPopup");
const cartList=document.getElementById("cartList");
const cartTotal=document.getElementById("cartTotal");
const searchInput=document.getElementById("search");
const tabButtons=document.querySelectorAll(".top-tabs button");
const authPopup=document.getElementById("authPopup");
const authTitle=document.getElementById("authTitle");
const authName=document.getElementById("authName");
const authEmail=document.getElementById("authEmail");
const authPassword=document.getElementById("authPassword");
const authBtn=document.getElementById("authBtn");
const toggleAuth=document.getElementById("toggleAuth");
const accountBtn=document.getElementById("accountBtn");
const accountNameSpan=document.getElementById("accountName");

const offerBar=document.getElementById("offerBar");
const offerText=document.getElementById("offerText");
const offerImg=document.getElementById("offerImg");
const offerContent=document.getElementById("offerContent");

const cartSummary=document.getElementById("cartSummary");
const cartCount=document.getElementById("cartCount");
const cartTotalSummary=document.getElementById("cartTotalSummary");
cartSummary.addEventListener("click", openCart);

const adminLogin=document.getElementById("adminLogin");
const adminPanel=document.getElementById("adminPanel");
const paymentPopup=document.getElementById("paymentPopup");

  // ===== رفع ومعاينة صورة المنتج (لوحة التاجر) =====
const pImgFile = document.getElementById("pImgFile");
const previewImg = document.getElementById("previewImg");

if(pImgFile){
  pImgFile.addEventListener("change",()=>{
    const file = pImgFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e=>{
      previewImg.src = e.target.result;
      previewImg.style.display = "block";
    };
    reader.readAsDataURL(file);
  });
}

const ADMIN_PASSWORD = "1234"; 
let isAdmin = false;

if(currentUser) accountNameSpan.innerText=currentUser.name;

// ---------------- دوال عامة ----------------
function showToast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2000);
}

// ---------------- عرض المنتجات ----------------
function renderProducts(list){
  productsDiv.innerHTML="";
  list.forEach(p=>{
    const productDiv=document.createElement("div");
    productDiv.className="product";

    productDiv.innerHTML = `
      <div class="heart">♡</div>
      <img src="${p.img}" class="product-img" style="cursor:zoom-in;">
      <h4>${p.name}</h4>
      <div class="price">${p.price} ر.ع</div>
      <button class="add-btn">أضف للسلة</button>
    `;

    const img = productDiv.querySelector(".product-img");
    img.addEventListener("click", () => openImagePopup(p));

    const heart = productDiv.querySelector(".heart");
    heart.addEventListener("click", ()=>{
      heart.innerText = heart.innerText==="♡" ? "❤️":"♡";
      showToast(
        heart.innerText==="❤️"
        ? "تمت الإضافة للمفضلة"
        : "تمت الإزالة من المفضلة"
      );
    });

    const addBtn = productDiv.querySelector(".add-btn");
    addBtn.addEventListener("click", ()=>{
      addToCart(p.name, p.price);
    });

    productsDiv.appendChild(productDiv);
  });
}


// ---------------- وظائف السلة ----------------
function addToCart(name,price){
  const existing=cart.find(i=>i.name===name);
  if(existing){ existing.qty+=1; }else{ cart.push({name,price,qty:1}); }
  updateCart();
  showToast("تمت الإضافة للسلة");
}

function updateCart(){
  cartList.innerHTML="";
  let total=0, totalQty=0;
  cart.forEach(i=>{
    total+=i.price*i.qty;
    totalQty+=i.qty;
    const li=document.createElement("li");
    li.innerHTML = `
      ${i.name}
      <div class="cart-item-controls">
        <button onclick="changeQty('${i.name}',-1)">-</button>
        <span>${i.qty}</span>
        <button onclick="changeQty('${i.name}',1)">+</button>
        <button onclick="removeItem('${i.name}')">🗑️</button>
        <span>${(i.price*i.qty).toFixed(2)} ر.ع</span>
      </div>
    `;
    cartList.appendChild(li);
  });
  cartTotal.innerText="الإجمالي: "+total.toFixed(2)+" ر.ع";
  cartCount.innerText = `${totalQty} عناصر`;
  cartTotalSummary.innerText = `${total.toFixed(2)} ر.ع`;
}

function changeQty(name,delta){
  const item=cart.find(i=>i.name===name);
  if(!item) return;
  item.qty+=delta;
  if(item.qty<1) removeItem(name);
  updateCart();
}

function removeItem(name){
  cart=cart.filter(i=>i.name!==name);
  updateCart();
}

function openCart(){ updateCart(); cartPopup.style.display="block"; }
  
  // ---------------- هنا ضع هذه الدالة الجديدة ----------------
function openImagePopup(product){
  document.getElementById("popupImg").src = product.img;
  document.getElementById("popupName").innerText = product.name;
  document.getElementById("popupPrice").innerText = product.price + " ر.ع";

  document.getElementById("popupAddBtn").onclick = ()=>{
    addToCart(product.name, product.price);
    document.getElementById("imagePopup").style.display = "none";
  };

  document.getElementById("imagePopup").style.display = "block";
}

// ---------------- التبويبات ----------------
tabButtons.forEach(btn=>{
  btn.addEventListener("click",()=>{
    tabButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentCategory=btn.dataset.category;
    searchInput.value="";
    renderProducts(productsData.filter(p=>p.category===currentCategory));
    updateOffer();
  });
});

// ---------------- البحث ----------------
searchInput.addEventListener("input",()=>{
  const query=searchInput.value.toLowerCase();
  renderProducts(productsData.filter(p=>p.category===currentCategory && p.name.toLowerCase().includes(query)));
});

// ---------------- العروض ----------------
let scrollPos=0; let requestId=null;
function startOfferScroll(){
  const scrollWidth=offerContent.scrollWidth - offerContent.clientWidth;
  if(scrollWidth>0){ cancelAnimationFrame(requestId); function step(){ scrollPos+=0.5; if(scrollPos>scrollWidth) scrollPos=0; offerContent.scrollLeft=scrollPos; requestId=requestAnimationFrame(step);} step(); } 
  else { offerContent.scrollLeft=0; cancelAnimationFrame(requestId); }
}

function updateOffer(){
  const offer=categoryOffers[currentCategory];
  if(offer){ offerText.innerText=offer.text; offerImg.src=offer.img; offerBar.style.display="flex"; scrollPos=0; setTimeout(startOfferScroll,100);}
  else{ offerText.innerText="عرض اليوم متاح!"; offerImg.src=""; offerContent.scrollLeft=0; cancelAnimationFrame(requestId);}
}

// ---------------- تسجيل ودخول المستخدم ----------------
let isRegister=false;
function openAuth(register=false){
  isRegister=register;
  authPopup.style.display="block";
  authName.style.display=register?"block":"none";
  authTitle.innerText=register?"تسجيل حساب":"تسجيل الدخول";
  authBtn.innerText=register?"سجل الآن":"دخول";
  toggleAuth.innerText=register?"لديك حساب؟ سجل الدخول":"ليس لديك حساب؟ سجل الآن";
}
toggleAuth.addEventListener("click",()=>openAuth(!isRegister));

authBtn.addEventListener("click",()=>{
  const email=authEmail.value.trim();
  const password=authPassword.value.trim();
  const name=authName.value.trim();
  authBtn.addEventListener("click",()=>{
  const email = authEmail.value.trim();
  const password = authPassword.value.trim();
  const name = authName.value.trim();

  if(isRegister){
    if(!name || !email || !password){ showToast("املأ جميع الحقول"); return; }
    auth.createUserWithEmailAndPassword(email, password)
      .then(userCredential=>{
        const user = userCredential.user;
        // حفظ الاسم في Firestore
        db.collection("users").doc(user.uid).set({name, email});
        currentUser = {uid: user.uid, name, email};
        accountNameSpan.innerText = name;
        showToast("تم التسجيل بنجاح");
        authPopup.style.display="none";
      })
      .catch(error=>{
        showToast(error.message);
      });
  } else {
    auth.signInWithEmailAndPassword(email, password)
      .then(userCredential=>{
        const user = userCredential.user;
        db.collection("users").doc(user.uid).get().then(doc=>{
          const data = doc.data();
          currentUser = {uid: user.uid, name: data.name, email: data.email};
          accountNameSpan.innerText = data.name;
          showToast("تم تسجيل الدخول");
          authPopup.style.display="none";
        });
      })
      .catch(error=>{
        showToast(error.message);
      });
  }
});

// ---------------- زر حساب المستخدم ----------------
accountBtn.addEventListener("click",()=>{
  if(!currentUser){ openAuth(false); return; }
  const choice=confirm("ماذا تريد؟\nموافق=تسجيل خروج\nإلغاء=عرض طلباتي");
  if(choice){
    localStorage.removeItem("currentUser");
    currentUser=null;
    accountNameSpan.innerText="حسابي";
    showToast("تم تسجيل الخروج");
  } else{
    const orders=JSON.parse(localStorage.getItem("orders")||"[]").filter(o=>o.user===currentUser.email);
    if(orders.length===0){ alert("لا توجد طلبات بعد"); return; }
    let msg="طلباتي:\n\n";
    orders.forEach((o,i)=>{ msg+=`${i+1}. ${o.items.map(it=>it.name+"("+it.qty+")").join(",")}\nالإجمالي: ${o.total} ر.ع\nطريقة الدفع: ${o.method}\n----------------\n`; });
    alert(msg);
  }
});

// ---------------- الدفع ----------------
function openPayment(){
  if(!currentUser){
    showToast("يرجى تسجيل الدخول لإتمام الطلب");
    openAuth(false);
    return;
  }
  paymentPopup.style.display="block";
}
paymentPopup.querySelectorAll('input[name="payMethod"]').forEach(r=>r.addEventListener("change",(e)=>{ document.getElementById("cardBox").style.display=e.target.value==="card"?"block":"none"; }));
function confirmPayment(){

  // التحقق من بيانات الشحن
  if(
    !shippingName.value ||
    !shippingPhone.value ||
    !shippingAddress.value
  ){
    showToast("يرجى تعبئة بيانات الشحن");
    return;
  }

  const method = paymentPopup.querySelector(
    'input[name="payMethod"]:checked'
  ).value;

  if(cart.length === 0){
    showToast("السلة فارغة");
    return;
  }

  // جلب الطلبات السابقة
  const orders = JSON.parse(localStorage.getItem("orders") || "[]");

  // إنشاء الطلب الجديد
  const newOrder = {
    id: Date.now(),
    user: currentUser.email,
    items: [...cart],
    total: cart.reduce((a,i)=>a + i.price * i.qty, 0),
    method: method,
    status: "paid",
    date: new Date().toLocaleString(),
    shipping:{
      name: shippingName.value,
      phone: shippingPhone.value,
      address: shippingAddress.value
    }
  };

  orders.push(newOrder);
  localStorage.setItem("orders", JSON.stringify(orders));

  // 📲 إرسال الطلب إلى واتساب
  const waNumber = "968XXXXXXXX"; // ← ضع رقمك هنا بدون +
  let waMessage = "🛍️ طلب جديد:\n\n";

  newOrder.items.forEach(item=>{
    waMessage += `- ${item.name} × ${item.qty}\n`;
  });

  waMessage += `\n💰 الإجمالي: ${newOrder.total} ر.ع`;
  waMessage += `\n💳 الدفع: ${newOrder.method}`;
  waMessage += `\n👤 الاسم: ${newOrder.shipping.name}`;
  waMessage += `\n📞 الهاتف: ${newOrder.shipping.phone}`;
  waMessage += `\n📍 العنوان: ${newOrder.shipping.address}`;

  window.open(
    `https://wa.me/${waNumber}?text=${encodeURIComponent(waMessage)}`,
    "_blank"
  );

  // تفريغ السلة
  cart = [];
  updateCart();
  paymentPopup.style.display = "none";

  showToast("تم تأكيد الطلب");
}
  
// ---------------- التاجر ----------------
function openAdminLogin(){ adminLogin.style.display="block"; }
function loginAdmin(){
  if(document.getElementById("adminPass").value===ADMIN_PASSWORD){
    isAdmin=true;
    adminLogin.style.display="none";
    adminPanel.style.display="block";
    renderAdminProducts();
    renderAdminOrders(); // ⭐ هذا السطر الجديد
  } else{
    showToast("الرقم السري خاطئ");
  }
}
function logoutAdmin(){ isAdmin=false; adminPanel.style.display="none"; }
function addProduct(){
  const pName = document.getElementById("pName").value.trim();
  const pPrice = parseFloat(document.getElementById("pPrice").value);
  const pCat = document.getElementById("pCat").value;
  const file = pImgFile.files[0];

  if(!pName || !pPrice || !file || !pCat){
    showToast("املأ جميع الحقول");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e){
    productsData.push({
      name: pName,
      price: pPrice,
      img: e.target.result,   // الصورة من الكاميرا/الاستديو
      category: pCat
    });

    saveProducts();
    renderProducts(productsData.filter(p=>p.category===currentCategory));
    renderAdminProducts();
    showToast("تم إضافة المنتج");

    // تفريغ الحقول
    document.getElementById("pName").value="";
    document.getElementById("pPrice").value="";
    pImgFile.value="";
    previewImg.style.display="none";
  };

  reader.readAsDataURL(file);
}

function renderAdminProducts(){
  const div=document.getElementById("adminProducts"); div.innerHTML="";
  productsData.forEach((p,i)=>{
    const d=document.createElement("div"); d.innerHTML=`${p.name} - ${p.price} ر.ع <button onclick="productsData.splice(${i},1); saveProducts(); renderProducts(productsData.filter(p=>p.category==='${currentCategory}')); renderAdminProducts();">🗑️</button>`;
    div.appendChild(d);
  });
}

// ---------------- إغلاق النوافذ ----------------
// تضمن أن كل أزرار ❌ تعمل حتى نافذة تكبير الصورة
document.addEventListener("DOMContentLoaded", ()=>{
  document.querySelectorAll(".popup-close").forEach(b=>{
    b.addEventListener("click", ()=> b.parentElement.style.display="none");
  });
});
  
 // ---------------- طلبات التاجر ----------------
function renderAdminOrders(){
  const orders = JSON.parse(localStorage.getItem("orders") || "[]");
  const box = document.getElementById("adminOrders");
  const stats = document.getElementById("orderStats");

  if(!box || !stats) return;

  let paid = orders.filter(o => o.status === "paid").length;
  let delivered = orders.filter(o => o.status === "delivered").length;

  stats.innerHTML = `
    💳 الطلبات المدفوعة: <b>${paid}</b><br>
    🚚 الطلبات التي تم توصيلها: <b>${delivered}</b>
  `;

  box.innerHTML = "";

  if(orders.length === 0){
    box.innerHTML = "<p>لا توجد طلبات بعد</p>";
    return;
  }

  orders.forEach((o, i) => {
    const div = document.createElement("div");
    div.style.border = "1px solid #ddd";
    div.style.borderRadius = "10px";
    div.style.padding = "8px";
    div.style.marginBottom = "10px";

    div.innerHTML = `
      <b>طلب رقم ${i + 1}</b><br>
      👤 ${o.user}<br>
      🕒 ${o.date || ""}<br>
      📦 ${o.items.map(it => `${it.name} (${it.qty})`).join(", ")}<br>
      💰 ${o.total} ر.ع<br>
      📌 الحالة الحالية: <b>${o.status || "paid"}</b><br><br>

      <button onclick="updateOrderStatus(${o.id}, 'paid')">💳 مدفوع</button>
      <button onclick="updateOrderStatus(${o.id}, 'delivered')">🚚 تم التوصيل</button>
    `;

    box.appendChild(div);
  });
}
  
function updateOrderStatus(id, status){
  let orders = JSON.parse(localStorage.getItem("orders") || "[]");
  const order = orders.find(o => o.id === id);
  if(!order) return;

  order.status = status;
  localStorage.setItem("orders", JSON.stringify(orders));

  renderAdminOrders();
  showToast("تم تحديث حالة الطلب");
}

// ---------------- بدء التطبيق ----------------
