<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛍️ متجر الملابس الحديث</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🛍️ متجر الملابس الحديث</h1>

  <button onclick="toggleAdmin()" class="admin-btn">لوحة التاجر 🔑</button>

  <input type="text" id="search" placeholder="🔍 ابحث عن منتج" oninput="searchProducts()">

  <!-- المنتجات -->
  <div id="products" class="products"></div>

  <!-- السلة -->
  <h2>🛒 السلة</h2>
  <div id="cart"></div>
  <p>الإجمالي: <span id="total">0</span> ر.ع</p>

  <!-- لوحة التاجر -->
  <div id="adminPanel" class="admin-panel" style="display:none;">
    <h2>🛠️ لوحة التحكم للتاجر</h2>

    <input id="adminPass" type="password" placeholder="أدخل كلمة السر">
    <button onclick="login()">دخول</button>

    <div id="adminControls" style="display:none;">
      <input id="name" placeholder="اسم المنتج">
      <input id="price" type="number" placeholder="السعر">
      <input id="img" placeholder="رابط الصورة">
      <button onclick="addProduct()">➕ إضافة المنتج</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
