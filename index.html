<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر</title>
<style>
/* ===================== أسلوب الجسم والخلفية ===================== */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:0;
  direction: rtl;
}

/* ===================== الحاوية الرئيسية ===================== */
.container {
  width: 90%;
  margin: 20px auto;
  text-align: center;
  padding: 15px;
}

/* ===================== التبويبات ===================== */
.top-tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:10px;
}
.top-tabs button{
  border:none;
  padding:8px 16px;
  border-radius:20px;
  background:#eee;
  font-size:14px;
  cursor:pointer;
}
.top-tabs .active{
  background:#000;
  color:#fff;
}

/* ===================== البحث ===================== */
.search-bar input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:10px;
}

/* ===================== تصنيف / تصفية ===================== */
.sort-filter-bar{
  display:flex;
  justify-content:space-around;
  background:#222;
  color:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}
.sort-filter-bar button{
  background:none;
  border:none;
  color:white;
  font-size:14px;
  cursor:pointer;
}

/* ===================== المنتجات ===================== */
.products{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}
.product{
  width:48%;
  background:white;
  border-radius:15px;
  padding:10px;
  position:relative;
  text-align:center;
}
.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}
.heart{
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  border-radius:50%;
  padding:6px;
}
.product h4{
  margin:8px 0 5px;
  font-size:14px;
}
.price{
  font-weight:bold;
}
.add-btn{
  width:100%;
  margin-top:5px;
  border:none;
  padding:8px;
  background:#ff5722;
  color:white;
  border-radius:20px;
  cursor:pointer;
}

/* ===================== تفاصيل المنتج ===================== */
#productDetail{
  display:none;
  text-align:center;
  margin-top:20px;
}
#productDetail img{
  width:200px;
  cursor:pointer;
  border-radius:10px;
}

/* ===================== السلة ===================== */
#cartButton {
  position: fixed;
  top: 10px;
  left: 10px;
  background: #ff9800;
  color: white;
  padding: 12px 18px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  z-index: 1000;
}
.cart-popup {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 350px;
  background: #fff3e0;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  z-index: 1000;
  display:none;
}
.cart-popup ul {
  list-style: none;
  padding: 0;
  max-height: 250px;
  overflow-y: auto;
  margin-bottom: 10px;
}
.cart-popup li{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  align-items:center;
}
.cart-popup button{
  background:#ff7043;
  color:white;
  border-radius:25px;
  padding:5px 10px;
  cursor:pointer;
}

/* ===================== إشعارات ===================== */
#toast{
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background:#333;
  color:white;
  padding:10px 20px;
  border-radius:25px;
  display:none;
  z-index:2000;
}

/* ===================== استجابة الشاشة ===================== */
@media (max-width:600px){
  .product{width:45%;}
  .cart-popup{width:90%;}
}
</style>
</head>
<body>

<div class="container">

  <!-- التبويبات -->
  <div class="top-tabs">
    <button class="active" onclick="filterCategory('بريميوم')">بريميوم</button>
    <button onclick="filterCategory('المنزل وأكثر')">المنزل وأكثر</button>
    <button onclick="filterCategory('الأطفال')">الأطفال</button>
  </div>

  <!-- البحث -->
  <div class="search-bar">
    <input type="text" id="search" placeholder="ابحث" oninput="applyFilters()">
  </div>

  <!-- تصنيف / تصفية -->
  <div class="sort-filter-bar">
    <button onclick="showToast('التصنيف قريباً')">⇅ تصنيف</button>
    <button onclick="showToast('التصفية قريباً')">☰ تصفية</button>
  </div>

  <!-- المنتجات -->
  <div class="products" id="products"></div>

  <!-- تفاصيل المنتج -->
  <div id="productDetail"></div>

</div>

<!-- زر السلة -->
<button id="cartButton" onclick="openCart()">🛒 السلة (<span id="cartCount">0</span>)</button>

<!-- نافذة السلة -->
<div class="cart-popup" id="cartPopup">
  <h3>سلة التسوق</h3>
  <ul id="cartPopupList"></ul>
  <p id="popupTotal">المجموع: 0 ر.ع</p>
  <button onclick="payNow()">ادفع الآن</button>
  <button onclick="closeCart()">إغلاق</button>
</div>

<div id="toast"></div>

<script>
// ========== البيانات ==========
let products=[
 {id:1,name:"فستان سهرة",price:81.93,img:"https://i.imgur.com/0y8Ftya.jpg",category:"بريميوم",stock:5,colors:["أزرق","أحمر"],sizes:["M","L"],deliveryDays:5},
 {id:2,name:"فستان أسود",price:60.79,img:"https://i.imgur.com/mP7a7bU.jpg",category:"بريميوم",stock:3,colors:["أسود"],sizes:["S","M"],deliveryDays:3},
 {id:3,name:"فستان وردي",price:74.5,img:"https://i.imgur.com/Yx8FqPz.jpg",category:"المنزل وأكثر",stock:4,colors:["وردي","أبيض"],sizes:["M","L"],deliveryDays:4}
];

let cart=[];

// ========== عرض المنتجات ==========
const productsDiv=document.getElementById("products");
const productDetailDiv=document.getElementById("productDetail");
const cartPopup=document.getElementById("cartPopup");
const cartPopupList=document.getElementById("cartPopupList");
const popupTotal=document.getElementById("popupTotal");
const cartCount=document.getElementById("cartCount");
const searchInput=document.getElementById("search");
const toastDiv=document.getElementById("toast");

function showToast(msg){
  toastDiv.innerText=msg;
  toastDiv.style.display="block";
  setTimeout(()=>toastDiv.style.display="none",2000);
}

function renderProducts(list){
  productsDiv.innerHTML="";
  productDetailDiv.style.display="none";
  productsDiv.style.display="flex";
  list.forEach(p=>{
    const div=document.createElement("div");
    div.className="product";
    div.innerHTML=`
      <div class="heart">♡</div>
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <p class="price">${p.price} ر.ع</p>
      <p>المتبقي: ${p.stock}</p>
      <button onclick="showProductDetail(${p.id})" ${p.stock===0?'disabled':''}>${p.stock===0?'نفدت الكمية':'عرض المنتج'}</button>
    `;
    productsDiv.appendChild(div);
  });
}

// ========== تفاصيل المنتج ==========
function showProductDetail(id){
  const product=products.find(p=>p.id===id);
  if(!product) return;
  productsDiv.style.display="none";
  productDetailDiv.style.display="block";

  let colorsOptions = product.colors.map(c=>`<option value="${c}">${c}</option>`).join("");
  let sizesOptions = product.sizes.map(s=>`<option value="${s}">${s}</option>`).join("");

  productDetailDiv.innerHTML=`
    <h2>${product.name}</h2>
    <img src="${product.img}" onclick="zoomImage('${product.img}')">
    <p>السعر: ${product.price} ر.ع</p>
    <p>المتبقي: ${product.stock}</p>
    <label>اللون: <select id="selectedColor">${colorsOptions}</select></label><br>
    <label>الحجم: <select id="selectedSize">${sizesOptions}</select></label><br>
    <label>الكمية: <input type="number" id="selectedQty" value="1" min="1" max="${product.stock}"></label><br>
    <button onclick="addDetailToCart(${product.id})">أضف إلى السلة</button>
    <button onclick="backToProducts()">عودة للمنتجات</button>
  `;
}

// ========== العودة للمنتجات ==========
function backToProducts(){
  productDetailDiv.style.display="none";
  renderProducts(products);
}

// ========== السلة ==========
function addDetailToCart(id){
  const product = products.find(p=>p.id===id);
  const color=document.getElementById("selectedColor").value;
  const size=document.getElementById("selectedSize").value;
  const qty=parseInt(document.getElementById("selectedQty").value);

  if(qty<1 || qty>product.stock){ showToast("كمية غير صحيحة"); return; }

  const existing=cart.find(i=>i.id===id && i.color===color && i.size===size);
  if(existing){ existing.qty+=qty; } 
  else{ cart.push({id:product.id,name:product.name,price:product.price,color,size,qty}); }

  product.stock-=qty;
  renderProducts(products);
  updateCartCount();
  showToast("تمت الإضافة للسلة ✅");
  backToProducts();
}

function updateCartCount(){
  cartCount.innerText=cart.reduce((sum,i)=>sum+i.qty,0);
}

function openCart(){
  renderCartPopup();
  cartPopup.style.display="block";
}
function closeCart(){ cartPopup.style.display="none"; }

function renderCartPopup(){
  cartPopupList.innerHTML="";
  let total=0;
  cart.forEach((item,index)=>{
    const li=document.createElement("li");
    li.innerHTML=`${item.name} - ${item.color}/${item.size} x${item.qty} - ${item.price*item.qty} ر.ع <button onclick="removeFromCart(${index})">حذف</button>`;
    cartPopupList.appendChild(li);
    total+=item.price*item.qty;
  });
  popupTotal.innerText=`المجموع: ${total} ر.ع`;
  updateCartCount();
}

function removeFromCart(index){
  const item=cart[index];
  const product=products.find(p=>p.id===item.id);
  product.stock+=item.qty;
  cart.splice(index,1);
  renderCartPopup();
  renderProducts(products);
  showToast("تم حذف المنتج من السلة ❌");
}

function payNow(){
  if(cart.length===0){ showToast("السلة فارغة"); return; }
  cart=[]; renderCartPopup(); renderProducts(products);
  showToast("تم الدفع بنجاح ✅");
}

// ========== البحث والفلاتر ==========
function applyFilters(){
  const val=searchInput.value.toLowerCase();
  renderProducts(products.filter(p=>p.name.toLowerCase().includes(val)));
}
function filterCategory(cat){
  renderProducts(products.filter(p=>p.category===cat));
}

// ========== تكبير الصورة ==========
function zoomImage(src){
  const zoomDiv=document.createElement("div");
  zoomDiv.style.position="fixed";
  zoomDiv.style.top="0";
  zoomDiv.style.left="0";
  zoomDiv.style.width="100%";
  zoomDiv.style.height="100%";
  zoomDiv.style.background="rgba(0,0,0,0.8)";
  zoomDiv.style.display="flex";
  zoomDiv.style.alignItems="center";
  zoomDiv.style.justifyContent="center";
  zoomDiv.style.zIndex="9999";
  zoomDiv.innerHTML=`<img src="${src}" style="max-width:90%; max-height:90%;"><button style="position:absolute;top:20px;right:20px;font-size:20px;" onclick="this.parentElement.remove()">✖</button>`;
  document.body.appendChild(zoomDiv);
}

// ========== عند بدء التشغيل ==========
renderProducts(products);
updateCartCount();
</script>

</body>
</html>
