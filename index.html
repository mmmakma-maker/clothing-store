<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجري للملابس النسائية</title>
<style>
body{
  margin:0;
  font-family: 'Segoe UI', Tahoma;
  background:#f5f5f5;
}
.container{
  padding:15px;
  padding-bottom:90px;
}
.top-tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:10px;
}
.top-tabs button{
  border:none;
  padding:8px 16px;
  border-radius:20px;
  background:#eee;
  font-size:14px;
  cursor:pointer;
}
.top-tabs .active{
  background:#000;
  color:#fff;
}
#offerBar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  background:#ffcc00;
  color:#000;
  font-weight:bold;
  border-radius:5px;
  margin-bottom:10px;
}
#offerBar #offerContent{
  display:flex;
  align-items:center;
  overflow:hidden;
  flex:1;
}
#offerBar img{
  height:50px;
  border-radius:5px;
  margin-right:10px;
}
#offerBar span{
  white-space:nowrap;
}
#offerBar button{
  border:none;
  background:none;
  font-weight:bold;
  cursor:pointer;
  font-size:18px;
}
#cartSummary{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#ff5722;
  color:white;
  font-weight:bold;
  border-radius:5px;
  margin-bottom:10px;
  cursor:pointer;
}
.search-bar input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:10px;
}
.sort-filter-bar{
  display:flex;
  justify-content:space-around;
  background:#222;
  color:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}
.sort-filter-bar button{
  background:none;
  border:none;
  color:white;
  font-size:14px;
}
.products{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.product{
  width:48%;
  background:white;
  border-radius:15px;
  padding:10px;
  position:relative;
}
.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}
.heart{
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  border-radius:50%;
  padding:6px;
  cursor:pointer;
}
.product h4{
  margin:8px 0 5px;
  font-size:14px;
}
.price{
  font-weight:bold;
}
.add-btn{
  width:100%;
  margin-top:5px;
  border:none;
  padding:8px;
  background:#ff5722;
  color:white;
  border-radius:20px;
  cursor:pointer;
}
.cart-popup, #authPopup, #adminLogin, #adminPanel, #paymentPopup{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  width:90%;
  max-width:350px;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:2000;
}
.cart-popup ul, #authPopup ul{
  list-style:none;
  padding:0;
}
.cart-popup li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.cart-item-controls{
  display:flex;
  gap:5px;
  align-items:center;
}
.cart-item-controls button{
  padding:2px 6px;
  border:none;
  border-radius:5px;
  background:#ff5722;
  color:white;
  cursor:pointer;
}
.cart-total{
  font-weight:bold;
  margin-top:10px;
  text-align:right;
}
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #ddd;
}
.bottom-nav button{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:14px;
}
#toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  display:none;
}
#authPopup input{
  width:100%;
  padding:8px;
  margin-bottom:8px;
  border-radius:5px;
  border:1px solid #ccc;
}
#authPopup button, #adminPanel button, #adminLogin button, #paymentPopup button{
  width:100%;
  padding:8px;
  background:#ff5722;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
  margin-bottom:5px;
}
#authPopup p{
  text-align:center;
  margin-top:8px;
  cursor:pointer;
  color:#007bff;
}
#adminPanel input, #adminPanel select{
  width:100%;
  padding:5px;
  margin-bottom:5px;
  border-radius:5px;
  border:1px solid #ccc;
}
#paymentPopup input{
  width:100%;
  padding:8px;
  margin-bottom:5px;
  border-radius:5px;
  border:1px solid #ccc;
}
.popup-close{
  position:absolute;
  top:12px;
  right:12px;
  background:#f2f2f2;
  border:none;
  font-size:16px;
  cursor:pointer;
  border-radius:50%;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#555;
  transition:0.2s;
}
.popup-close:hover{
  background:#ff5722;
  color:white;
}
</style>
</head>
<body>

<div class="container">

  <div class="top-tabs">
    <button class="active" data-category="omani">عمانية</button>
    <button data-category="blushi">بلوشي</button>
    <button data-category="pieces">قطع بلوشي</button>
  </div>

  <div id="offerBar">
    <div id="offerContent">
      <img id="offerImg" src="" alt="عرض">
      <span id="offerText"></span>
    </div>
    <button onclick="offerBar.style.display='none'">❌</button>
  </div>

  <div id="cartSummary">
    <span id="cartCount">0 عناصر</span>
    <span id="cartTotalSummary">0 ر.ع</span>
  </div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="ابحث">
  </div>

  <div class="sort-filter-bar">
    <button onclick="showToast('التصنيف قريباً')">⇅ تصنيف</button>
    <button onclick="showToast('التصفية قريباً')">☰ تصفية</button>
  </div>

  <div class="products" id="products"></div>

</div>

<!-- السلة -->
<div class="cart-popup" id="cartPopup">
  <button class="popup-close">❌</button>
  <h3>سلة التسوق</h3>
  <ul id="cartList"></ul>
  <div class="cart-total" id="cartTotal">الإجمالي: 0 ر.ع</div>
  <button onclick="openPayment()">💳 الدفع الآن</button>
  <button onclick="cartPopup.style.display='none'">إغلاق</button>
</div>

<!-- الدفع -->
<div class="cart-popup" id="paymentPopup">
  <button class="popup-close">❌</button>
  <h3>إتمام الدفع</h3>
  <label><input type="radio" name="payMethod" value="cod" checked> الدفع عند الاستلام</label><br><br>
  <label><input type="radio" name="payMethod" value="card"> بطاقة (تجريبي)</label>
  <div id="cardBox" style="display:none;margin-top:10px;">
    <input placeholder="رقم البطاقة">
    <input placeholder="MM/YY">
    <input placeholder="CVV">
  </div>
  <button onclick="confirmPayment()">✅ تأكيد الطلب</button>
  <button onclick="paymentPopup.style.display='none'">إلغاء</button>
</div>

<!-- تسجيل / دخول -->
<div id="authPopup">
  <button class="popup-close">❌</button>
  <h3 id="authTitle">تسجيل الدخول</h3>
  <input type="text" id="authName" placeholder="الاسم" style="display:none;">
  <input type="email" id="authEmail" placeholder="البريد الإلكتروني">
  <input type="password" id="authPassword" placeholder="كلمة المرور">
  <button id="authBtn">دخول</button>
  <p id="toggleAuth">ليس لديك حساب؟ سجل الآن</p>
</div>

<!-- دخول التاجر -->
<div id="adminLogin">
  <button class="popup-close">❌</button>
  <h3>دخول التاجر</h3>
  <input type="password" id="adminPass" placeholder="الرقم السري">
  <button onclick="loginAdmin()">دخول</button>
</div>

<!-- لوحة التاجر -->
<div id="adminPanel">
  <button class="popup-close">❌</button>
  <h3>لوحة تحكم التاجر</h3>
  <input id="pName" placeholder="اسم المنتج">
  <input id="pPrice" type="number" placeholder="السعر">
  <input id="pImg" placeholder="رابط الصورة">
  <select id="pCat">
    <option value="omani">عمانية</option>
    <option value="blushi">بلوشي</option>
    <option value="pieces">قطع بلوشي</option>
  </select>
  <button onclick="addProduct()">➕ إضافة منتج</button>
  <hr>
  <div id="adminProducts"></div>
  <button onclick="logoutAdmin()">خروج</button>
</div>

<div class="bottom-nav">
  <button>🏠<span>الرئيسية</span></button>
  <button>📂<span>الفئات</span></button>
  <button>🔥<span>تخفيضات</span></button>
  <button onclick="openCart()">🛒<span>السلة</span></button>
  <button><span id="accountName">حسابي</span></button>
  <button onclick="openAdminLogin()">🛠️<span>تاجر</span></button>
</div>

<div id="toast"></div>

<script>
// بيانات المنتجات
let productsData = JSON.parse(localStorage.getItem("products")) || [
  {name:"عباية عمانية سوداء",price:80,img:"https://i.imgur.com/0y8Ftya.jpg",category:"omani"},
  {name:"فستان بلوشي مطرز",price:95,img:"https://i.imgur.com/Yx8FqPz.jpg",category:"blushi"},
  {name:"قطعة بلوشية",price:40,img:"https://i.imgur.com/1bX5QH6.jpg",category:"pieces"}
];
function saveProducts(){ localStorage.setItem("products", JSON.stringify(productsData)); }

const categoryOffers={
  omani:{text:"عرض اليوم: خصم 10% على جميع العباءات العمانية!",img:"https://i.imgur.com/0y8Ftya.jpg"},
  blushi:{text:"عرض اليوم: فستان بلوشي مطرز بسعر خاص!",img:"https://i.imgur.com/Yx8FqPz.jpg"},
  pieces:{text:"عرض اليوم: قطعة بلوشية إضافية عند شراء أي منتج!",img:"https://i.imgur.com/1bX5QH6.jpg"}
};

let cart=[];
let currentCategory="omani";

const productsDiv=document.getElementById("products");
const cartPopup=document.getElementById("cartPopup");
const cartList=document.getElementById("cartList");
const cartTotal=document.getElementById("cartTotal");
const searchInput=document.getElementById("search");
const tabButtons=document.querySelectorAll(".top-tabs button");
const authPopup=document.getElementById("authPopup");
const authTitle=document.getElementById("authTitle");
const authName=document.getElementById("authName");
const authEmail=document.getElementById("authEmail");
const authPassword=document.getElementById("authPassword");
const authBtn=document.getElementById("authBtn");
const toggleAuth=document.getElementById("toggleAuth");
const accountBtn=document.getElementById("accountName");

const offerBar=document.getElementById("offerBar");
const offerText=document.getElementById("offerText");
const offerImg=document.getElementById("offerImg");
const offerContent=document.getElementById("offerContent");

const cartCount=document.getElementById("cartCount");
const cartTotalSummary=document.getElementById("cartTotalSummary");

const adminLogin=document.getElementById("adminLogin");
const adminPanel=document.getElementById("adminPanel");
const paymentPopup=document.getElementById("paymentPopup");

const ADMIN_PASSWORD = "1234"; 
let isAdmin = false;

// ---------------- currentUser ----------------
let currentUser = JSON.parse(localStorage.getItem("currentUser")) || null;
if(currentUser) accountBtn.innerText=currentUser.name;

// ---------------- وظائف المنتجات ----------------
function renderProducts(list){
  productsDiv.innerHTML="";
  list.forEach(p=>{
    const productDiv=document.createElement("div");
    productDiv.className="product";
    productDiv.innerHTML = `
      <div class="heart">♡</div>
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <div class="price">${p.price} ر.ع</div>
      <button class="add-btn">أضف للسلة</button>
    `;
    const heart=productDiv.querySelector(".heart");
    heart.addEventListener("click",()=>{
      heart.innerText = heart.innerText==="♡" ? "❤️" : "♡";
      showToast(heart.innerText==="❤️"?"تمت الإضافة للمفضلة":"تمت الإزالة من المفضلة");
    });
    const addBtn=productDiv.querySelector(".add-btn");
    addBtn.addEventListener("click",()=>{ addToCart(p.name,p.price); });
    productsDiv.appendChild(productDiv);
  });
}

// ---------------- وظائف السلة ----------------
function addToCart(name,price){
  const existing=cart.find(i=>i.name===name);
  if(existing){ existing.qty+=1; }else{ cart.push({name,price,qty:1}); }
  updateCart();
  showToast("تمت الإضافة للسلة");
}

function updateCart(){
  cartList.innerHTML="";
  let total=0, totalQty=0;
  cart.forEach(i=>{
    total+=i.price*i.qty;
    totalQty+=i.qty;
    const li=document.createElement("li");
    li.innerHTML = `
      ${i.name}
      <div class="cart-item-controls">
        <button onclick="changeQty('${i.name}',-1)">-</button>
        <span>${i.qty}</span>
        <button onclick="changeQty('${i.name}',1)">+</button>
        <button onclick="removeItem('${i.name}')">🗑️</button>
        <span>${(i.price*i.qty).toFixed(2)} ر.ع</span>
      </div>
    `;
    cartList.appendChild(li);
  });
  cartTotal.innerText="الإجمالي: "+total.toFixed(2)+" ر.ع";
  cartCount.innerText = `${totalQty} عناصر`;
  cartTotalSummary.innerText = `${total.toFixed(2)} ر.ع`;
}

function changeQty(name,delta){
  const item=cart.find(i=>i.name===name);
  if(!item) return;
  item.qty+=delta;
  if(item.qty<1) removeItem(name);
  updateCart();
}

function removeItem(name){
  cart=cart.filter(i=>i.name!==name);
  updateCart();
}

function openCart(){
  updateCart();
  cartPopup.style.display="block";
}

// ---------------- التبويبات ----------------
tabButtons.forEach(btn=>{
  btn.addEventListener("click",()=>{
    tabButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentCategory=btn.dataset.category;
    searchInput.value="";
    renderProducts(productsData.filter(p=>p.category===currentCategory));
    updateOffer();
  });
});

// ---------------- البحث ----------------
searchInput.addEventListener("input",()=>{
  const query=searchInput.value.toLowerCase();
  renderProducts(productsData.filter(p=>p.category===currentCategory && p.name.toLowerCase().includes(query)));
});

// ---------------- التنبيهات ----------------
function showToast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2000);
}

// ---------------- شريط العروض ----------------
let scrollPos=0;
let requestId=null;
function startOfferScroll(){
  const scrollWidth=offerContent.scrollWidth - offerContent.clientWidth;
  if(scrollWidth>0){
    cancelAnimationFrame(requestId);
    function step(){
      scrollPos+=0.5;
      if(scrollPos>scrollWidth) scrollPos=0;
      offerContent.scrollLeft=scrollPos;
      requestId=requestAnimationFrame(step);
    }
    step();
  } else { offerContent.scrollLeft=0; cancelAnimationFrame(requestId); }
}

function updateOffer(){
  const offer=categoryOffers[currentCategory];
  if(offer){
    offerText.innerText=offer.text;
    offerImg.src=offer.img;
    offerBar.style.display="flex";
    scrollPos=0;
    setTimeout(startOfferScroll,100);
  }else{
    offerText.innerText="عرض اليوم متاح!";
    offerImg.src="";
    offerContent.scrollLeft=0;
    offerBar.style.display="flex";
  }
}

// ---------------- تسجيل الدخول / التسجيل ----------------
let isLoginMode=true;
toggleAuth.addEventListener("click",()=>{
  isLoginMode=!isLoginMode;
  authTitle.innerText=isLoginMode?"تسجيل الدخول":"تسجيل حساب جديد";
  authName.style.display=isLoginMode?"none":"block";
  authBtn.innerText=isLoginMode?"دخول":"سجل الآن";
  toggleAuth.innerText=isLoginMode?"ليس لديك حساب؟ سجل الآن":"لديك حساب؟ سجل الدخول";
});

authBtn.addEventListener("click",()=>{
  const email=authEmail.value.trim();
  const pass=authPassword.value.trim();
  if(!email||!pass){ showToast("الرجاء ملء جميع الحقول"); return; }
  if(isLoginMode){
    const user=JSON.parse(localStorage.getItem("users")||"[]").find(u=>u.email===email && u.password===pass);
    if(user){ currentUser=user; localStorage.setItem("currentUser",JSON.stringify(user)); accountBtn.innerText=user.name; authPopup.style.display="none"; showToast("تم تسجيل الدخول"); }
    else showToast("بيانات خاطئة");
  } else {
    const name=authName.value.trim();
    if(!name){ showToast("الرجاء إدخال الاسم"); return; }
    let users=JSON.parse(localStorage.getItem("users")||"[]");
    if(users.some(u=>u.email===email)){ showToast("البريد موجود مسبقاً"); return; }
    const newUser={name,email,password:pass};
    users.push(newUser);
    localStorage.setItem("users",JSON.stringify(users));
    currentUser=newUser;
    localStorage.setItem("currentUser",JSON.stringify(newUser));
    accountBtn.innerText=name;
    authPopup.style.display="none";
    showToast("تم إنشاء الحساب وتسجيل الدخول");
  }
});

// ---------------- التاجر ----------------
function openAdminLogin(){ adminLogin.style.display="block"; }
function loginAdmin(){
  if(document.getElementById("adminPass").value===ADMIN_PASSWORD){
    isAdmin=true;
    adminLogin.style.display="none";
    adminPanel.style.display="block";
    renderAdminProducts();
    showToast("تم تسجيل دخول التاجر");
  } else { showToast("كلمة مرور خاطئة"); }
}
function logoutAdmin(){ isAdmin=false; adminPanel.style.display="none"; showToast("تم تسجيل الخروج"); }

// ---------------- لوحة التاجر ----------------
function addProduct(){
  const name=document.getElementById("pName").value;
  const price=parseFloat(document.getElementById("pPrice").value);
  const img=document.getElementById("pImg").value;
  const cat=document.getElementById("pCat").value;
  if(!name || !price || !img){ showToast("املأ كل الحقول"); return; }
  productsData.push({name,price,img,category:cat});
  saveProducts();
  renderAdminProducts();
  if(cat===currentCategory) renderProducts(productsData.filter(p=>p.category===currentCategory));
  showToast("تمت الإضافة");
}

function renderAdminProducts(){
  const container=document.getElementById("adminProducts");
  container.innerHTML="";
  productsData.forEach((p,i)=>{
    const div=document.createElement("div");
    div.innerHTML=`${p.name} - ${p.price} ر.ع 
      <button onclick="removeAdminProduct(${i})">🗑️</button>`;
    container.appendChild(div);
  });
}

function removeAdminProduct(i){
  if(confirm("هل تريد حذف المنتج؟")){
    productsData.splice(i,1);
    saveProducts();
    renderAdminProducts();
    renderProducts(productsData.filter(p=>p.category===currentCategory));
    showToast("تم الحذف");
  }
}

// ---------------- الدفع ----------------
function openPayment(){
  cartPopup.style.display="none";
  paymentPopup.style.display="block";
}

document.querySelectorAll('input[name="payMethod"]').forEach(el=>{
  el.addEventListener("change",()=>{
    document.getElementById("cardBox").style.display = el.value==="card"?"block":"none";
  });
});

function confirmPayment(){
  cart=[];
  updateCart();
  paymentPopup.style.display="none";
  showToast("تم الدفع بنجاح");
}

// ---------------- أزرار الإغلاق ----------------
document.querySelectorAll(".popup-close").forEach(b=>b.addEventListener("click",()=>b.parentElement.style.display="none"));

// ---------------- بدء التطبيق ----------------
renderProducts(productsData.filter(p=>p.category=currentCategory));
updateOffer();
updateCart();
</script>
</body>
</html>
