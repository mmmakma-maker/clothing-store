<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر</title>
<style>
/* ===== الأساس ===== */
body{
  margin:0;
  font-family: 'Segoe UI', Tahoma;
  background:#f5f5f5;
}

/* ===== الحاوية ===== */
.container{
  padding:15px;
  padding-bottom:90px;
}

/* ===== التبويبات العلوية ===== */
.top-tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:10px;
}
.top-tabs button{
  border:none;
  padding:8px 16px;
  border-radius:20px;
  background:#eee;
  font-size:14px;
  cursor:pointer;
}
.top-tabs .active{
  background:#000;
  color:#fff;
}

/* ===== البحث ===== */
.search-bar input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:10px;
}

/* ===== تصنيف / تصفية ===== */
.sort-filter-bar{
  display:flex;
  justify-content:space-around;
  background:#222;
  color:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}
.sort-filter-bar button{
  background:none;
  border:none;
  color:white;
  font-size:14px;
  cursor:pointer;
}

/* ===== المنتجات ===== */
.products{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  justify-content:space-between;
}
.product{
  width:48%;
  background:white;
  border-radius:15px;
  padding:10px;
  position:relative;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  transition: transform 0.2s;
}
.product:hover{
  transform: scale(1.03);
}
.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}
.heart{
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  border-radius:50%;
  padding:6px;
  cursor:pointer;
}
.product h4{
  margin:8px 0 5px;
  font-size:14px;
}
.price{
  font-weight:bold;
}
.add-btn{
  width:100%;
  margin-top:5px;
  border:none;
  padding:8px;
  background:#ff5722;
  color:white;
  border-radius:20px;
  cursor:pointer;
  transition: transform 0.2s;
}
.add-btn:hover{
  transform: scale(1.05);
}

/* ===== السلة ===== */
.cart-popup{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  width:90%;
  max-width:350px;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:2000;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
}
.cart-popup ul{
  list-style:none;
  padding:0;
  max-height:250px;
  overflow-y:auto;
}
.cart-popup li{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

/* ===== نافذة حسابي ===== */
.account-popup{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  width:90%;
  max-width:350px;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:2000;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
  text-align:center;
}
.account-popup input{
  width:80%;
  padding:8px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ccc;
}
.account-popup button{
  padding:8px 15px;
  border:none;
  background:#4caf50;
  color:white;
  border-radius:20px;
  cursor:pointer;
  margin-top:10px;
  transition: transform 0.2s;
}
.account-popup button:hover{
  transform: scale(1.05);
}

/* ===== شريط سفلي ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #ddd;
}
.bottom-nav button{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:14px;
  cursor:pointer;
}

/* ===== تنبيه ===== */
#toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  display:none;
  z-index:3000;
}

/* ===== استجابة الهواتف ===== */
@media(max-width:600px){
  .product{ width:100%; }
}
</style>
</head>
<body>
<div class="container">
  <!-- التبويبات -->
  <div class="top-tabs">
    <button class="active">بريميوم</button>
    <button>المنزل وأكثر</button>
    <button>الأطفال</button>
  </div>

  <!-- البحث -->
  <div class="search-bar">
    <input type="text" id="search" placeholder="ابحث">
  </div>

  <!-- تصنيف / تصفية -->
  <div class="sort-filter-bar">
    <button onclick="showToast('التصنيف قريباً')">⇅ تصنيف</button>
    <button onclick="showToast('التصفية قريباً')">☰ تصفية</button>
  </div>

  <!-- المنتجات -->
  <div class="products" id="products"></div>
</div>

<!-- السلة -->
<div class="cart-popup" id="cartPopup">
  <h3>سلة التسوق</h3>
  <ul id="cartList"></ul>
  <button onclick="cartPopup.style.display='none'">إغلاق</button>
</div>

<!-- نافذة حسابي -->
<div class="account-popup" id="accountPopup">
  <h3>حسابي</h3>
  <div id="userSection">
    <input type="text" id="username" placeholder="أدخل اسمك">
    <button onclick="login()">تسجيل الدخول</button>
  </div>
  <div id="loggedInSection" style="display:none;">
    <p>مرحباً، <span id="displayName"></span></p>
    <button onclick="logout()">تسجيل الخروج</button>
  </div>
  <button onclick="accountPopup.style.display='none'">إغلاق</button>
</div>

<!-- الشريط السفلي -->
<div class="bottom-nav">
  <button>🏠<span>الرئيسية</span></button>
  <button onclick="showToast('الفئات قريباً')">📂<span>الفئات</span></button>
  <button onclick="showToast('تخفيضات قريباً')">🔥<span>تخفيضات</span></button>
  <button onclick="openCart()">🛒<span>السلة</span></button>
  <button onclick="openAccount()">👤<span>حسابي</span></button>
</div>

<div id="toast"></div>

<script>
// ===== البيانات =====
const productsData=[
  {name:"فستان سهرة",price:81.93,img:"https://i.imgur.com/0y8Ftya.jpg"},
  {name:"فستان أسود",price:60.79,img:"https://i.imgur.com/mP7a7bU.jpg"},
  {name:"فستان وردي",price:74.50,img:"https://i.imgur.com/Yx8FqPz.jpg"},
  {name:"فستان مطرز",price:92.00,img:"https://i.imgur.com/7pG9x0k.jpg"}
];
let cart=[];

// ===== عرض المنتجات =====
const productsDiv=document.getElementById("products");
function renderProducts(list){
  productsDiv.innerHTML="";
  list.forEach(p=>{
    productsDiv.innerHTML+=`
    <div class="product">
      <div class="heart">♡</div>
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <div class="price">${p.price} ر.ع</div>
      <button class="add-btn" onclick='addToCart("${p.name}",${p.price})'>أضف للسلة</button>
    </div>`;
  });
}
function addToCart(name,price){
  cart.push({name,price});
  showToast("تمت الإضافة للسلة");
  renderCart();
}

// ===== السلة =====
const cartPopup=document.getElementById("cartPopup");
const cartList=document.getElementById("cartList");
function openCart(){ renderCart(); cartPopup.style.display="block"; }
function renderCart(){
  cartList.innerHTML="";
  cart.forEach(i=>{
    cartList.innerHTML+=`<li>${i.name}<span>${i.price} ر.ع</span></li>`;
  });
}

// ===== حسابي =====
const accountPopup=document.getElementById("accountPopup");
function openAccount(){
  accountPopup.style.display="block";
}
function login(){
  const username=document.getElementById("username").value;
  if(username.trim()!==""){
    document.getElementById("displayName").innerText=username;
    document.getElementById("userSection").style.display="none";
    document.getElementById("loggedInSection").style.display="block";
    showToast("تم تسجيل الدخول");
  } else showToast("يرجى إدخال الاسم");
}
function logout(){
  document.getElementById("username").value="";
  document.getElementById("userSection").style.display="block";
  document.getElementById("loggedInSection").style.display="none";
  accountPopup.style.display="none";
  showToast("تم تسجيل الخروج");
}

// ===== إشعارات =====
function showToast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg; t.style.display="block";
  setTimeout(()=>t.style.display="none",2000);
}

// ===== بداية =====
renderProducts(productsData);
</script>
</body>
</html>
