<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر</title>
<style>
/* ===== الأساس ===== */
body{
  margin:0;
  font-family: 'Segoe UI', Tahoma;
  background:#f5f5f5;
}
/* ===== الحاوية ===== */
.container{
  padding:15px;
  padding-bottom:90px;
}
/* ===== التبويبات العلوية ===== */
.top-tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:10px;
}
.top-tabs button{
  border:none;
  padding:8px 16px;
  border-radius:20px;
  background:#eee;
  font-size:14px;
  cursor:pointer;
}
.top-tabs .active{
  background:#000;
  color:#fff;
}
/* ===== البحث ===== */
.search-bar input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:10px;
}
/* ===== تصنيف / تصفية ===== */
.sort-filter-bar{
  display:flex;
  justify-content:space-around;
  background:#222;
  color:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}
.sort-filter-bar button{
  background:none;
  border:none;
  color:white;
  font-size:14px;
  cursor:pointer;
}
/* ===== المنتجات ===== */
.products{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.product{
  width:48%;
  background:white;
  border-radius:15px;
  padding:10px;
  position:relative;
}
.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}
.heart{
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  border-radius:50%;
  padding:6px;
}
.product h4{
  margin:8px 0 5px;
  font-size:14px;
}
.price{
  font-weight:bold;
}
.add-btn{
  width:100%;
  margin-top:5px;
  border:none;
  padding:8px;
  background:#ff5722;
  color:white;
  border-radius:20px;
  cursor:pointer;
}
/* ===== تفاصيل المنتج ===== */
.product-detail{
  display:none;
  background:#fff;
  padding:15px;
  border-radius:15px;
  max-width:400px;
  margin:20px auto;
}
/* ===== السلة ===== */
.cart-popup{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  width:90%;
  max-width:350px;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:2000;
}
.cart-popup ul{
  list-style:none;
  padding:0;
}
.cart-popup li{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}
/* ===== شريط سفلي ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #ddd;
}
.bottom-nav button{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:14px;
  cursor:pointer;
}
/* ===== تنبيه ===== */
#toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  display:none;
  z-index:2000;
}
</style>
</head>
<body>

<div class="container">

  <!-- التبويبات -->
  <div class="top-tabs">
    <button class="active">بريميوم</button>
    <button>المنزل وأكثر</button>
    <button>الأطفال</button>
  </div>

  <!-- البحث -->
  <div class="search-bar">
    <input type="text" id="search" placeholder="ابحث">
  </div>

  <!-- تصنيف / تصفية -->
  <div class="sort-filter-bar">
    <button onclick="showToast('التصنيف قريباً')">⇅ تصنيف</button>
    <button onclick="showToast('التصفية قريباً')">☰ تصفية</button>
  </div>

  <!-- المنتجات -->
  <div class="products" id="products"></div>

  <!-- تفاصيل المنتج -->
  <div class="product-detail" id="productDetail"></div>

</div>

<!-- السلة -->
<div class="cart-popup" id="cartPopup">
  <h3>سلة التسوق</h3>
  <ul id="cartList"></ul>
  <div id="popupTotal"></div>
  <button onclick="closeCart()">إغلاق</button>
  <button onclick="payNow()">الدفع الآن</button>
</div>

<!-- الشريط السفلي -->
<div class="bottom-nav">
  <button onclick="showToast('الرئيسية')">🏠<span>الرئيسية</span></button>
  <button onclick="showToast('الفئات')">📂<span>الفئات</span></button>
  <button onclick="showToast('تخفيضات')">🔥<span>تخفيضات</span></button>
  <button onclick="openCart()">🛒<span>السلة</span></button>
  <button onclick="showToast('حسابي')">👤<span>حسابي</span></button>
</div>

<div id="toast"></div>

<script>
// ===== البيانات =====
const productsData=[
 {id:1,name:"فستان سهرة",price:81.93,img:"https://i.imgur.com/0y8Ftya.jpg",stock:5},
 {id:2,name:"فستان أسود",price:60.79,img:"https://i.imgur.com/mP7a7bU.jpg",stock:3},
 {id:3,name:"فستان وردي",price:74.50,img:"https://i.imgur.com/Yx8FqPz.jpg",stock:4},
 {id:4,name:"فستان مطرز",price:92.00,img:"https://i.imgur.com/7pG9x0k.jpg",stock:2}
];

let cart = [];

// ===== DOM =====
const productsDiv=document.getElementById("products");
const cartPopup=document.getElementById("cartPopup");
const cartList=document.getElementById("cartList");
const productDetailDiv=document.getElementById("productDetail");
const popupTotal=document.getElementById("popupTotal");
const toastDiv=document.getElementById("toast");

// ===== الوظائف =====
function showToast(msg){
  toastDiv.innerText=msg;
  toastDiv.style.display="block";
  setTimeout(()=>toastDiv.style.display="none",2000);
}

// عرض المنتجات
function renderProducts(list){
  productsDiv.innerHTML="";
  productDetailDiv.style.display="none";
  list.forEach(p=>{
    const div=document.createElement("div");
    div.className="product";
    div.innerHTML=`
      <div class="heart">♡</div>
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <div class="price">${p.price} ر.ع</div>
      <button class="add-btn" onclick='addToCart(${p.id})'>أضف للسلة</button>
      <button onclick='showProductDetail(${p.id})'>عرض المنتج</button>
    `;
    productsDiv.appendChild(div);
  });
}

// عرض تفاصيل المنتج
function showProductDetail(id){
  const p = productsData.find(x=>x.id===id);
  if(!p) return;
  productsDiv.style.display="none";
  productDetailDiv.style.display="block";
  productDetailDiv.innerHTML=`
    <h2>${p.name}</h2>
    <img src="${p.img}" style="width:200px;">
    <p>السعر: ${p.price} ر.ع</p>
    <p>المتبقي: ${p.stock}</p>
    <label>الكمية: <input type="number" id="qty" value="1" min="1" max="${p.stock}"></label><br>
    <button onclick="addToCart(${p.id})">أضف للسلة</button>
    <button onclick="backToProducts()">عودة للمنتجات</button>
  `;
}

// العودة للمنتجات
function backToProducts(){
  productDetailDiv.style.display="none";
  renderProducts(productsData);
}

// إضافة للسلة
function addToCart(id){
  const p = productsData.find(x=>x.id===id);
  if(!p) return;
  let qty = 1;
  if(document.getElementById("qty")) qty=parseInt(document.getElementById("qty").value);
  if(qty>p.stock) { showToast("الكمية غير متاحة"); return; }
  const existing = cart.find(i=>i.id===id);
  if(existing){ existing.qty += qty; } else { cart.push({id:p.id,name:p.name,price:p.price,qty:qty}); }
  p.stock -= qty;
  showToast("تمت الإضافة للسلة ✅");
  renderProducts(productsData);
  renderCart();
}

// عرض السلة
function openCart(){
  renderCart();
  cartPopup.style.display="block";
}
function closeCart(){ cartPopup.style.display="none"; }
function renderCart(){
  cartList.innerHTML="";
  let total=0;
  cart.forEach((i,idx)=>{
    cartList.innerHTML+=`<li>${i.name} x${i.qty} - ${i.price*i.qty} ر.ع <button onclick="removeFromCart(${idx})">حذف</button></li>`;
    total += i.price*i.qty;
  });
  popupTotal.innerText=`المجموع: ${total} ر.ع`;
}

// إزالة منتج من السلة
function removeFromCart(idx){
  const i = cart[idx];
  const p = productsData.find(x=>x.id===i.id);
  p.stock += i.qty;
  cart.splice(idx,1);
  renderCart();
  renderProducts(productsData);
}

// الدفع
function payNow(){
  if(cart.length===0) { showToast("السلة فارغة"); return; }
  showToast("تم الدفع بنجاح ✅");
  cart = [];
  renderCart();
}

// ===== تشغيل المتجر =====
renderProducts(productsData);
</script>

</body>
</html>
