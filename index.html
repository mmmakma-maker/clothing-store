<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الملابس الحديث</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">
    <h1>🛍️ متجر الملابس الحديث</h1>
    <button class="admin-btn">لوحة التاجر</button>

    <div id="products"></div>
    <div id="cart"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
<div class="app">
  <h1>🛍️ متجر الملابس الحديث</h1>
  <button class="admin-btn" onclick="showAdminLogin()">🔑 التاجر</button>
  <div id="adminLogin" class="admin-login">
    <input type="password" id="adminPass" placeholder="أدخل كلمة السر">
    <button onclick="loginAdmin()">دخول</button>
    <p id="adminMsg" class="admin-msg"></p>
  </div>
  <div id="products" class="products"></div>
  <div class="cart-section">
    <h2>🛒 سلة المشتريات</h2>
    <ul id="cart"></ul>
    <h3 id="total">الإجمالي: 0 ر.ع</h3>
    <label>📦 فترة التوصيل:</label>
    <select id="delivery">
      <option>خلال 24 ساعة</option>
      <option>خلال 2-3 أيام</option>
      <option>خلال أسبوع</option>
    </select>
    <button class="pay" onclick="payNow()">💳 ادفع الآن</button>
    <p id="status"></p>
  </div>
  <div id="adminPanel" class="admin-panel">
    <h2>🛠️ لوحة التحكم للتاجر</h2>
    <label>اسم المنتج:</label>
    <input type="text" id="newName" placeholder="اسم المنتج">
    <label>السعر:</label>
    <input type="number" id="newPrice" placeholder="السعر">
    <label>كمية المخزون:</label>
    <input type="number" id="newStock" placeholder="الكمية">
    <label>رابط صورة 1:</label>
    <input type="text" id="newImg1" placeholder="رابط الصورة 1">
    <label>رابط صورة 2:</label>
    <input type="text" id="newImg2" placeholder="رابط الصورة 2">
    <label>رابط صورة 3:</label>
    <input type="text" id="newImg3" placeholder="رابط الصورة 3">
    <button onclick="addProduct()">➕ إضافة المنتج</button>
  </div>
<script src="script.js"></script>
</div>
</body>
</html>
