<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', Tahoma;
  background:#f5f5f5;
}
.container{
  padding:15px;
  padding-bottom:90px;
}
.top-tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:10px;
}
.top-tabs button{
  border:none;
  padding:8px 16px;
  border-radius:20px;
  background:#eee;
  font-size:14px;
  cursor:pointer;
}
.top-tabs .active{
  background:#000;
  color:#fff;
}
.search-bar input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:10px;
}
.sort-filter-bar{
  display:flex;
  justify-content:space-around;
  background:#222;
  color:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}
.sort-filter-bar button{
  background:none;
  border:none;
  color:white;
  font-size:14px;
}
.products{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.product{
  width:48%;
  background:white;
  border-radius:15px;
  padding:10px;
  position:relative;
}
.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}
.heart{
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  border-radius:50%;
  padding:6px;
  cursor:pointer;
}
.product h4{
  margin:8px 0 5px;
  font-size:14px;
}
.price{
  font-weight:bold;
}
.add-btn{
  width:100%;
  margin-top:5px;
  border:none;
  padding:8px;
  background:#ff5722;
  color:white;
  border-radius:20px;
  cursor:pointer;
}
.cart-popup{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  width:90%;
  max-width:350px;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:2000;
}
.cart-popup ul{
  list-style:none;
  padding:0;
}
.cart-popup li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.cart-item-controls{
  display:flex;
  gap:5px;
  align-items:center;
}
.cart-item-controls button{
  padding:2px 6px;
  border:none;
  border-radius:5px;
  background:#ff5722;
  color:white;
  cursor:pointer;
}
.cart-total{
  font-weight:bold;
  margin-top:10px;
  text-align:right;
}
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #ddd;
}
.bottom-nav button{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:14px;
}
#toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  display:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="top-tabs">
    <button class="active" data-category="premium">بريميوم</button>
    <button data-category="home">المنزل وأكثر</button>
    <button data-category="kids">الأطفال</button>
  </div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="ابحث">
  </div>

  <div class="sort-filter-bar">
    <button onclick="showToast('التصنيف قريباً')">⇅ تصنيف</button>
    <button onclick="showToast('التصفية قريباً')">☰ تصفية</button>
  </div>

  <div class="products" id="products"></div>

</div>

<div class="cart-popup" id="cartPopup">
  <h3>سلة التسوق</h3>
  <ul id="cartList"></ul>
  <div class="cart-total" id="cartTotal">الإجمالي: 0 ر.ع</div>
  <button onclick="cartPopup.style.display='none'">إغلاق</button>
</div>

<div class="bottom-nav">
  <button>🏠<span>الرئيسية</span></button>
  <button>📂<span>الفئات</span></button>
  <button>🔥<span>تخفيضات</span></button>
  <button onclick="openCart()">🛒<span>السلة</span></button>
  <button>👤<span>حسابي</span></button>
</div>

<div id="toast"></div>

<script>
const productsData=[
 {name:"فستان سهرة",price:81.93,img:"https://i.imgur.com/0y8Ftya.jpg",category:"premium"},
 {name:"فستان أسود",price:60.79,img:"https://i.imgur.com/mP7a7bU.jpg",category:"premium"},
 {name:"فستان وردي",price:74.50,img:"https://i.imgur.com/Yx8FqPz.jpg",category:"premium"},
 {name:"وسادة منزلية",price:15.00,img:"https://i.imgur.com/1bX5QH6.jpg",category:"home"},
 {name:"مفرش سرير",price:30.00,img:"https://i.imgur.com/2ZqE3pT.jpg",category:"home"},
 {name:"لعبة أطفال",price:12.50,img:"https://i.imgur.com/3Q9p2dX.jpg",category:"kids"}
];

let cart=[];
let currentCategory="premium";

const productsDiv=document.getElementById("products");
const cartPopup=document.getElementById("cartPopup");
const cartList=document.getElementById("cartList");
const cartTotal=document.getElementById("cartTotal");
const searchInput=document.getElementById("search");
const tabButtons=document.querySelectorAll(".top-tabs button");

function renderProducts(list){
  productsDiv.innerHTML="";
  list.forEach(p=>{
    const productDiv=document.createElement("div");
    productDiv.className="product";
    productDiv.innerHTML=`
      <div class="heart">♡</div>
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <div class="price">${p.price} ر.ع</div>
      <button class="add-btn">أضف للسلة</button>
    `;
    const heart=productDiv.querySelector(".heart");
    heart.addEventListener("click",()=>{
      heart.innerText = heart.innerText==="♡" ? "❤️" : "♡";
      showToast(heart.innerText==="❤️"?"تمت الإضافة للمفضلة":"تمت الإزالة من المفضلة");
    });
    const addBtn=productDiv.querySelector(".add-btn");
    addBtn.addEventListener("click",()=>{ addToCart(p.name,p.price); });
    productsDiv.appendChild(productDiv);
  });
}

function addToCart(name,price){
  const existing=cart.find(i=>i.name===name);
  if(existing){
    existing.qty+=1;
  }else{
    cart.push({name,price,qty:1});
  }
  updateCart();
  showToast("تمت الإضافة للسلة");
}

function updateCart(){
  cartList.innerHTML="";
  let total=0;
  cart.forEach(i=>{
    total+=i.price*i.qty;
    const li=document.createElement("li");
    li.innerHTML=`
      ${i.name} 
      <div class="cart-item-controls">
        <button onclick="changeQty('${i.name}',-1)">-</button>
        <span>${i.qty}</span>
        <button onclick="changeQty('${i.name}',1)">+</button>
        <button onclick="removeItem('${i.name}')">🗑️</button>
        <span>${(i.price*i.qty).toFixed(2)} ر.ع</span>
      </div>
    `;
    cartList.appendChild(li);
  });
  cartTotal.innerText="الإجمالي: "+total.toFixed(2)+" ر.ع";
}

function changeQty(name,delta){
  const item=cart.find(i=>i.name===name);
  if(!item) return;
  item.qty+=delta;
  if(item.qty<1) removeItem(name);
  updateCart();
}

function removeItem(name){
  cart=cart.filter(i=>i.name!==name);
  updateCart();
}

function openCart(){
  updateCart();
  cartPopup.style.display="block";
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2000);
}

// البحث الحي مع الفئة الحالية
searchInput.addEventListener("input",()=>{
  const query=searchInput.value.toLowerCase();
  const filtered=productsData.filter(p=>p.category===currentCategory && p.name.toLowerCase().includes(query));
  renderProducts(filtered);
});

// التبويبات
tabButtons.forEach(btn=>{
  btn.addEventListener("click",()=>{
    tabButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentCategory=btn.dataset.category;
    searchInput.value="";
    renderProducts(productsData.filter(p=>p.category===currentCategory));
  });
});

renderProducts(productsData.filter(p=>p.category===currentCategory));
</script>

</body>
</html>
