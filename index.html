#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 20px;border-radius:20px;display:none;}
#authPopup input{width:100%;padding:8px;margin-bottom:8px;border-radius:5px;border:1px solid #ccc;}
#authPopup button, #adminPanel button, #adminLogin button{width:100%;padding:8px;background:#ff5722;color:white;border:none;border-radius:5px;cursor:pointer;margin-bottom:5px;}
#authPopup p{text-align:center;margin-top:8px;cursor:pointer;color:#007bff;}

#paymentPopup input{width:100%;padding:8px;margin-bottom:5px;border-radius:5px;border:1px solid #ccc;}

.popup-close{position:absolute;top:12px;right:12px;background:#f2f2f2;border:none;font-size:16px;cursor:pointer;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#555;transition:0.2s;}
.popup-close:hover{background:#ff5722;color:white;}

<script>
let products = [];      // لتخزين المنتجات من Firebase
let cart = [];          // السلة
let currentUser = null; // المستخدم الحالي
let isAdmin = false;    // حالة التاجر

// عناصر DOM
const productsContainer = document.getElementById("products");
const cartPopup = document.getElementById("cartPopup");
const cartList = document.getElementById("cartList");
const cartTotalElem = document.getElementById("cartTotal");
const cartCountElem = document.getElementById("cartCount");
const cartTotalSummary = document.getElementById("cartTotalSummary");
const paymentPopup = document.getElementById("paymentPopup");

// ====================== Toast ======================
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.style.display = "block";
  setTimeout(()=>toast.style.display="none", 2500);
}

// ====================== فتح السلة ======================
function openCart(){
  renderCart();
  cartPopup.style.display = "block";
}

// ====================== عرض السلة ======================
function renderCart(){
  cartList.innerHTML = "";
  let total = 0;
  cart.forEach((item,i)=>{
    total += item.price * item.qty;
    const li = document.createElement("li");
    li.innerHTML = `
      ${item.name} (${item.qty}) - ${item.price*item.qty} ر.ع
      <div class="cart-item-controls">
        <button onclick="changeQty(${i},-1)">-</button>
        <button onclick="changeQty(${i},1)">+</button>
        <button onclick="removeItem(${i})">🗑️</button>
      </div>
    `;
    cartList.appendChild(li);
  });
  cartTotalElem.innerText = "الإجمالي: "+total+" ر.ع";
  cartCountElem.innerText = cart.length + " عناصر";
  cartTotalSummary.innerText = total+" ر.ع";
}

// ====================== تغيير الكمية ======================
function changeQty(index, delta){
  cart[index].qty += delta;
  if(cart[index].qty <= 0) cart.splice(index,1);
  renderCart();
}

// ====================== إزالة عنصر ======================
function removeItem(index){
  cart.splice(index,1);
  renderCart();
}
</script>
<script>
// ====================== جلب المنتجات من Firebase ======================
function fetchProducts(){
  db.collection("products").get().then(snapshot=>{
    products = snapshot.docs.map(doc=>({id: doc.id, ...doc.data()}));
    renderProducts();
  });
}

// ====================== عرض المنتجات ======================
function renderProducts(filterCategory=null, search=""){
  productsContainer.innerHTML = "";
  let filtered = products;

  if(filterCategory) filtered = filtered.filter(p=>p.category===filterCategory);
  if(search) filtered = filtered.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));

  if(filtered.length === 0){
    productsContainer.innerHTML = "<p>لا توجد منتجات</p>";
    return;
  }

  filtered.forEach(prod=>{
    const div = document.createElement("div");
    div.classList.add("product");
    div.innerHTML = `
      <img src="${prod.img}" alt="${prod.name}" onclick="openImagePopup('${prod.id}')">
      <div class="heart" onclick="toggleFavorite('${prod.id}')">❤️</div>
      <h4>${prod.name}</h4>
      <div class="price">${prod.price} ر.ع</div>
      <button class="add-btn" onclick="addToCart('${prod.id}')">أضف للسلة</button>
    `;
    productsContainer.appendChild(div);
  });
}

// ====================== فتح الصورة ======================
function openImagePopup(id){
  const p = products.find(p=>p.id===id);
  if(!p) return;
  const popup = document.getElementById("imagePopup");
  document.getElementById("popupImg").src = p.img;
  document.getElementById("popupName").innerText = p.name;
  document.getElementById("popupPrice").innerText = p.price + " ر.ع";
  document.getElementById("popupAddBtn").onclick = ()=>{ addToCart(p.id); popup.style.display='none'; };
  popup.style.display = "block";
}

// ====================== إضافة للسلة ======================
function addToCart(id){
  const prod = products.find(p=>p.id===id);
  if(!prod) return;
  const existing = cart.find(c=>c.id===id);
  if(existing) existing.qty +=1;
  else cart.push({...prod, qty:1});
  renderCart();
  showToast(prod.name+" أضيفت للسلة");
}

// ====================== مفضلة (غير مرتبطة مع Firebase بعد) ======================
function toggleFavorite(id){
  showToast("ميزة المفضلة قريباً!");
}

// ====================== البحث ======================
document.getElementById("search").addEventListener("input", e=>{
  renderProducts(null, e.target.value);
});

// ====================== التبويبات ======================
document.querySelectorAll(".top-tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".top-tabs button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    renderProducts(btn.dataset.category);
  });
});
</script>
<script>
// ====================== فتح نافذة الدفع ======================
function openPayment(){
  if(cart.length === 0){
    showToast("السلة فارغة!");
    return;
  }
  paymentPopup.style.display = "block";
}

// ====================== تفعيل/إخفاء حقل البطاقة ======================
const payMethods = paymentPopup.querySelectorAll('input[name="payMethod"]');
payMethods.forEach(radio=>{
  radio.addEventListener("change", ()=>{
    document.getElementById("cardBox").style.display = radio.value==="card" ? "block" : "none";
  });
});

// ====================== تأكيد الدفع ======================
function confirmPayment() {
  const shippingName = document.getElementById("shippingName").value.trim();
  const shippingPhone = document.getElementById("shippingPhone").value.trim();
  const shippingAddress = document.getElementById("shippingAddress").value.trim();

  if(!shippingName || !shippingPhone || !shippingAddress){
    showToast("يرجى تعبئة بيانات الشحن بالكامل");
    return;
  }

  if(cart.length === 0){
    showToast("السلة فارغة");
    return;
  }

  const method = paymentPopup.querySelector('input[name="payMethod"]:checked').value;

  const newOrder = {
    userId: currentUser ? currentUser.uid : "guest",
    userEmail: currentUser ? currentUser.email : "guest@example.com",
    userName: currentUser && currentUser.name ? currentUser.name : shippingName,
    items: [...cart],
    total: cart.reduce((a,i)=>a + i.price*i.qty,0),
    shipping:{
      name: shippingName,
      phone: shippingPhone,
      address: shippingAddress
    },
    method: method,
    status: "paid",
    date: firebase.firestore.Timestamp.fromDate(new Date())
  };

  // حفظ الطلب في Firebase
  db.collection("orders").add(newOrder)
    .then(docRef=>{
      showToast("تم حفظ الطلب بنجاح!");

      // إرسال الطلب على واتساب
      const waNumber = "96890000000"; // ضع رقمك هنا بصيغة دولية
      let waMessage = `🛍️ طلب جديد من ${newOrder.userName}:\n\n`;
      newOrder.items.forEach(item=>{
        waMessage += `- ${item.name} × ${item.qty}\n`;
      });
      waMessage += `\n💰 الإجمالي: ${newOrder.total} ر.ع`;
      waMessage += `\n💳 الدفع: ${newOrder.method}`;
      waMessage += `\n👤 الاسم: ${newOrder.shipping.name}`;
      waMessage += `\n📞 الهاتف: ${newOrder.shipping.phone}`;
      waMessage += `\n📍 العنوان: ${newOrder.shipping.address}`;

      window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(waMessage)}`, "_blank");

      // تفريغ السلة
      cart = [];
      renderCart();
      paymentPopup.style.display = "none";
    })
    .catch(err=>{
      console.error(err);
      showToast("حدث خطأ أثناء حفظ الطلب!");
    });
}

// ====================== عرض طلبات المستخدم ======================
function showMyOrders(){
  if(!currentUser) {
    showToast("يجب تسجيل الدخول أولاً!");
    return;
  }

  db.collection("orders").where("userId", "==", currentUser.uid).get()
    .then(snapshot=>{
      if(snapshot.empty){ alert("لا توجد طلبات بعد"); return; }

      let msg = "🛒 طلباتي:\n\n";
      snapshot.docs.forEach((doc,i)=>{
        const o = doc.data();
        msg += `${i+1}. ${o.items.map(it=>it.name+" ("+it.qty+")").join(", ")}\n`;
        msg += `الإجمالي: ${o.total} ر.ع\n`;
        msg += `طريقة الدفع: ${o.method}\n----------------\n`;
      });
      alert(msg);
    })
    .catch(err=> showToast("حدث خطأ أثناء جلب الطلبات!"));
}
</script>
<script>
// ====================== فتح نافذة دخول التاجر ======================
function openAdminLogin(){
  document.getElementById("adminLogin").style.display = "block";
}

// ====================== تسجيل دخول التاجر ======================
function loginAdmin(){
  const pass = document.getElementById("adminPass").value.trim();
  const adminPassword = "123456"; // ضع كلمة مرور التاجر هنا
  if(pass === adminPassword){
    isAdmin = true;
    document.getElementById("adminLogin").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    renderAdminOrders();
    renderAdminProducts();
    showToast("تم تسجيل الدخول كـ تاجر");
  } else {
    showToast("كلمة المرور خاطئة!");
  }
}

// ====================== تسجيل خروج التاجر ======================
function logoutAdmin(){
  isAdmin = false;
  document.getElementById("adminPanel").style.display = "none";
  showToast("تم تسجيل الخروج");
}

// ====================== عرض الطلبات في لوحة التاجر ======================
function renderAdminOrders(){
  const box = document.getElementById("adminOrders");
  const stats = document.getElementById("orderStats");

  if(!box || !stats) return;

  db.collection("orders").orderBy("date","desc").get().then(snapshot=>{
    const orders = snapshot.docs.map(doc=>({id: doc.id, ...doc.data()}));

    let paid = orders.filter(o => o.status==="paid").length;
    let delivered = orders.filter(o => o.status==="delivered").length;

    stats.innerHTML = `
      💳 الطلبات المدفوعة: <b>${paid}</b><br>
      🚚 الطلبات التي تم توصيلها: <b>${delivered}</b>
    `;

    box.innerHTML = "";

    if(orders.length===0){
      box.innerHTML = "<p>لا توجد طلبات بعد</p>";
      return;
    }

    orders.forEach((o,i)=>{
      const div = document.createElement("div");
      div.style.border="1px solid #ddd";
      div.style.borderRadius="10px";
      div.style.padding="8px";
      div.style.marginBottom="10px";

      div.innerHTML = `
        <b>طلب رقم ${i+1}</b><br>
        👤 ${o.shipping.name} (${o.userEmail})<br>
        🕒 ${o.date.toDate ? o.date.toDate().toLocaleString() : o.date}<br>
        📦 ${o.items.map(it=>`${it.name} (${it.qty})`).join(", ")}<br>
        💰 ${o.total} ر.ع<br>
        📌 الحالة الحالية: <b>${o.status || "paid"}</b><br><br>
        <button onclick="updateOrderStatus('${o.id}','paid')">💳 مدفوع</button>
        <button onclick="updateOrderStatus('${o.id}','delivered')">🚚 تم التوصيل</button>
      `;
      box.appendChild(div);
    });
  });
}

// ====================== تحديث حالة الطلب ======================
function updateOrderStatus(id,status){
  db.collection("orders").doc(id).update({status})
    .then(()=>{
      showToast("تم تحديث حالة الطلب");
      renderAdminOrders();
    })
    .catch(err=>{
      console.error(err);
      showToast("حدث خطأ أثناء تحديث الحالة");
    });
}

// ====================== إضافة منتج جديد ======================
function addProduct(){
  const name = document.getElementById("pName").value.trim();
  const price = parseFloat(document.getElementById("pPrice").value);
  const category = document.getElementById("pCat").value;
  const url = document.getElementById("pImgFile").value.trim(); // هنا رابط الصورة

  if(!name || !price || !category || !url){
    showToast("يرجى تعبئة كل الحقول");
    return;
  }

  db.collection("products").add({
    name: name,
    price: price,
    category: category,
    img: url
  }).then(()=>{
    showToast("تم إضافة المنتج بنجاح!");
    renderProducts();
    renderAdminProducts();
    document.getElementById("pName").value = "";
    document.getElementById("pPrice").value = "";
    document.getElementById("pImgFile").value = "";
  }).catch(err=>{
    console.error(err);
    showToast("حدث خطأ أثناء إضافة المنتج");
  });
}

// ====================== عرض المنتجات في لوحة التاجر ======================
function renderAdminProducts(){
  const box = document.getElementById("adminProducts");
  box.innerHTML = "<h4>📦 المنتجات</h4>";

  db.collection("products").get().then(snapshot=>{
    if(snapshot.empty){ box.innerHTML += "<p>لا توجد منتجات</p>"; return; }

    snapshot.docs.forEach(doc=>{
      const p = {id: doc.id, ...doc.data()};
      const div = document.createElement("div");
      div.style.border="1px solid #ddd";
      div.style.borderRadius="10px";
      div.style.padding="5px";
      div.style.marginBottom="5px";
      div.innerHTML = `
        <b>${p.name}</b> - ${p.price} ر.ع<br>
        <img src="${p.img}" style="width:100%;height:120px;object-fit:cover;border-radius:5px;"><br>
        <button onclick="deleteProduct('${p.id}')">🗑️ حذف</button>
      `;
      box.appendChild(div);
    });
  });
}

// ====================== حذف منتج ======================
function deleteProduct(id){
  if(confirm("هل تريد حذف المنتج؟")){
    db.collection("products").doc(id).delete()
      .then(()=>{
        showToast("تم حذف المنتج");
        renderProducts();
        renderAdminProducts();
      })
      .catch(err=>{
        console.error(err);
        showToast("حدث خطأ أثناء الحذف");
      });
  }
}

// ====================== معاينة صورة المنتج قبل الرفع ======================
document.getElementById("pImgFile").addEventListener("change", e=>{
  const file = e.target.files[0];
  const previewImg = document.getElementById("previewImg");
  if(file){
    previewImg.src = URL.createObjectURL(file);
    previewImg.style.display = "block";
  }
});
</script>
<script>
// ====================== فتح نافذة تسجيل الدخول ======================
document.getElementById("accountBtn").addEventListener("click", ()=>{
  document.getElementById("authPopup").style.display = "block";
});

// ====================== التبديل بين تسجيل الدخول والتسجيل ======================
const toggleAuth = document.getElementById("toggleAuth");
const authTitle = document.getElementById("authTitle");
const authNameInput = document.getElementById("authName");
const authBtn = document.getElementById("authBtn");

let isLogin = true;
toggleAuth.addEventListener("click", ()=>{
  isLogin = !isLogin;
  authTitle.innerText = isLogin ? "تسجيل الدخول" : "إنشاء حساب";
  authNameInput.style.display = isLogin ? "none" : "block";
  toggleAuth.innerText = isLogin ? "ليس لديك حساب؟ سجل الآن" : "لديك حساب؟ سجل الدخول";
});

// ====================== تسجيل الدخول / إنشاء حساب ======================
authBtn.addEventListener("click", ()=>{
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value.trim();
  const name = document.getElementById("authName").value.trim();

  if(!email || !password || (!isLogin && !name)){
    showToast("يرجى تعبئة كل الحقول");
    return;
  }

  if(isLogin){
    auth.signInWithEmailAndPassword(email,password)
      .then(res=>{
        currentUser = res.user;
        document.getElementById("authPopup").style.display = "none";
        showToast("تم تسجيل الدخول!");
        document.getElementById("accountName").innerText = currentUser.email.split("@")[0];
      })
      .catch(err=>{
        console.error(err);
        showToast("بيانات تسجيل الدخول غير صحيحة!");
      });
  } else {
    auth.createUserWithEmailAndPassword(email,password)
      .then(res=>{
        currentUser = res.user;
        // إضافة الاسم إلى المستخدم في Firestore
        db.collection("users").doc(currentUser.uid).set({name:name,email:email});
        document.getElementById("authPopup").style.display = "none";
        showToast("تم إنشاء الحساب!");
        document.getElementById("accountName").innerText = name;
      })
      .catch(err=>{
        console.error(err);
        showToast("حدث خطأ أثناء إنشاء الحساب!");
      });
  }
});

// ====================== التحقق من الجلسة عند تحميل الصفحة ======================
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;
    // جلب الاسم من Firestore إن وجد
    db.collection("users").doc(user.uid).get().then(doc=>{
      if(doc.exists && doc.data().name){
        document.getElementById("accountName").innerText = doc.data().name;
      } else {
        document.getElementById("accountName").innerText = user.email.split("@")[0];
      }
    });
  } else {
    currentUser = null;
    document.getElementById("accountName").innerText = "حسابي";
  }
});

// ====================== إغلاق النوافذ المنبثقة ======================
document.querySelectorAll(".popup-close").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    btn.parentElement.style.display = "none";
  });
});

// ====================== تحميل المنتجات عند فتح الصفحة ======================
fetchProducts();
</script>
