<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>متجر الملابس</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🛍️ متجر الملابس</h1>

<button onclick="toggleAdmin()">لوحة التاجر</button>

<div class="controls">
<input id="search" placeholder="🔍 ابحث">
<select id="category">
<option value="">كل التصنيفات</option>
<option value="فساتين">فساتين</option>
<option value="عبايات">عبايات</option>
</select>
</div>

<div id="products"></div>

<h2>🛒 السلة</h2>
<div id="cart"></div>

<h3>🚚 وقت التوصيل</h3>
<select id="delivery">
<option>اليوم</option>
<option>غدًا</option>
<option>بعد 3 أيام</option>
</select>

<button onclick="checkout()">تأكيد الطلب</button>

<hr>

<div id="admin" style="display:none">
<h2>لوحة التاجر</h2>
<input id="pname" placeholder="اسم المنتج">
<input id="pprice" type="number" placeholder="السعر">
<input id="pimg" placeholder="رابط الصورة">
<input id="pstock" type="number" placeholder="الكمية">
<select id="pcat">
<option>فساتين</option>
<option>عبايات</option>
</select>
<button onclick="addProduct()">إضافة منتج</button>
</div>

<script src="script.js"></script>
</body>
</html>
