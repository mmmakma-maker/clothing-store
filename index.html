<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر</title>
<style>
/* ===== الأساس ===== */
body{
  margin:0;
  font-family: 'Segoe UI', Tahoma;
  background:#f5f5f5;
}

/* ===== الحاوية ===== */
.container{
  padding:15px;
  padding-bottom:90px;
}

/* ===== التبويبات العلوية ===== */
.top-tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:10px;
}
.top-tabs button{
  border:none;
  padding:8px 16px;
  border-radius:20px;
  background:#eee;
  font-size:14px;
  cursor:pointer;
}
.top-tabs .active{
  background:#000;
  color:#fff;
}

/* ===== البحث ===== */
.search-bar input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:10px;
}

/* ===== تصنيف / تصفية ===== */
.sort-filter-bar{
  display:flex;
  justify-content:space-around;
  background:#222;
  color:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}
.sort-filter-bar button{
  background:none;
  border:none;
  color:white;
  font-size:14px;
  cursor:pointer;
}

/* ===== المنتجات ===== */
.products{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.product{
  width:48%;
  background:white;
  border-radius:15px;
  padding:10px;
  position:relative;
}
.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}
.heart{
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  border-radius:50%;
  padding:6px;
}
.product h4{
  margin:8px 0 5px;
  font-size:14px;
}
.price{
  font-weight:bold;
}
.add-btn{
  width:100%;
  margin-top:5px;
  border:none;
  padding:8px;
  background:#ff5722;
  color:white;
  border-radius:20px;
  cursor:pointer;
}

/* ===== تفاصيل المنتج ===== */
.product-detail{
  display:none;
  padding:20px;
  border-radius:15px;
  background:white;
  margin:10px 0;
}

/* ===== السلة ===== */
.cart-popup{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  width:90%;
  max-width:350px;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:2000;
}
.cart-popup ul{
  list-style:none;
  padding:0;
  max-height:250px;
  overflow-y:auto;
}
.cart-popup li{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

/* ===== شريط سفلي ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #ddd;
}
.bottom-nav button{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:14px;
  cursor:pointer;
}

/* ===== تنبيه ===== */
#toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  display:none;
  z-index:2000;
}
</style>
</head>
<body>

<div class="container">

  <!-- التبويبات -->
  <div class="top-tabs">
    <button class="active">بريميوم</button>
    <button>المنزل وأكثر</button>
    <button>الأطفال</button>
  </div>

  <!-- البحث -->
  <div class="search-bar">
    <input type="text" id="search" placeholder="ابحث">
  </div>

  <!-- تصنيف / تصفية -->
  <div class="sort-filter-bar">
    <button onclick="showToast('التصنيف قريباً')">⇅ تصنيف</button>
    <button onclick="showToast('التصفية قريباً')">☰ تصفية</button>
  </div>

  <!-- المنتجات -->
  <div class="products" id="products"></div>

  <!-- تفاصيل المنتج -->
  <div class="product-detail" id="productDetail"></div>

</div>

<!-- السلة -->
<div class="cart-popup" id="cartPopup">
  <h3>سلة التسوق</h3>
  <ul id="cartList"></ul>
  <button onclick="cartPopup.style.display='none'">إغلاق</button>
</div>

<!-- الشريط السفلي -->
<div class="bottom-nav">
  <button>🏠<span>الرئيسية</span></button>
  <button>📂<span>الفئات</span></button>
  <button>🔥<span>تخفيضات</span></button>
  <button onclick="openCart()">🛒<span>السلة</span></button>
  <button>👤<span>حسابي</span></button>
</div>

<div id="toast"></div>

<script>
// ===== البيانات =====
const productsData = [
  {id:1,name:"فستان سهرة",price:81.93,img:"https://i.imgur.com/0y8Ftya.jpg",stock:5,colors:["أحمر","أزرق"],sizes:["M","L"],deliveryDays:3},
  {id:2,name:"فستان أسود",price:60.79,img:"https://i.imgur.com/mP7a7bU.jpg",stock:3,colors:["أسود"],sizes:["S","M"],deliveryDays:2},
  {id:3,name:"فستان وردي",price:74.50,img:"https://i.imgur.com/Yx8FqPz.jpg",stock:4,colors:["وردي"],sizes:["M","L"],deliveryDays:4},
  {id:4,name:"فستان مطرز",price:92.00,img:"https://i.imgur.com/7pG9x0k.jpg",stock:2,colors:["أبيض"],sizes:["L"],deliveryDays:5}
];
let cart = [];

// ===== DOM =====
const productsDiv=document.getElementById("products");
const cartPopup=document.getElementById("cartPopup");
const cartList=document.getElementById("cartList");
const productDetailDiv=document.getElementById("productDetail");
const toastDiv=document.getElementById("toast");

// ===== عرض المنتجات =====
function renderProducts(list){
  productsDiv.innerHTML="";
  productDetailDiv.style.display="none";
  productsDiv.style.display="flex";
  list.forEach(p=>{
    const div=document.createElement("div");
    div.className="product";
    div.innerHTML=`
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <div class="price">${p.price} ر.ع</div>
      <div>المتبقي: ${p.stock}</div>
      <button onclick="showProductDetail(${p.id})" ${p.stock===0?'disabled':''}>
        ${p.stock===0?'نفدت الكمية':'عرض المنتج'}
      </button>
      <button class="add-btn" onclick='addToCart(${p.id},1)'>أضف للسلة</button>
    `;
    productsDiv.appendChild(div);
  });
}

// ===== تفاصيل المنتج =====
function showProductDetail(id){
  const product = productsData.find(p=>p.id===id);
  if(!product) return;
  productsDiv.style.display="none";
  productDetailDiv.style.display="block";
  productDetailDiv.innerHTML=`
    <h3>${product.name}</h3>
    <img src="${product.img}" style="width:100%; cursor:pointer;" onclick="zoomImage('${product.img}')">
    <p>السعر: ${product.price} ر.ع</p>
    <p>المتبقي: ${product.stock}</p>
    <p>مدة التوصيل: ${product.deliveryDays} أيام</p>
    <label>اللون:
      <select id="selectedColor">
        ${product.colors.map(c=>`<option value="${c}">${c}</option>`).join('')}
      </select>
    </label>
    <br>
    <label>الحجم:
      <select id="selectedSize">
        ${product.sizes.map(s=>`<option value="${s}">${s}</option>`).join('')}
      </select>
    </label>
    <br>
    <label>الكمية: <input type="number" id="selectedQty" value="1" min="1" max="${product.stock}"></label>
    <br>
    <button onclick="addDetailToCart(${product.id})">أضف إلى السلة</button>
    <button onclick="renderProducts(productsData)">عودة للمنتجات</button>
  `;
}

// ===== إضافة للسلة =====
function addToCart(id,qty){
  const product = productsData.find(p=>p.id===id);
  if(!product || product.stock<qty) return showToast("الكمية غير متوفرة");
  const existing = cart.find(i=>i.id===id);
  if(existing){ existing.qty += qty; } 
  else { cart.push({id, name:product.name, price:product.price, qty}); }
  product.stock -= qty;
  showToast("تمت الإضافة للسلة");
  renderProducts(productsData);
}

function addDetailToCart(id){
  const product = productsData.find(p=>p.id===id);
  const color = document.getElementById("selectedColor").value;
  const size = document.getElementById("selectedSize").value;
  const qty = parseInt(document.getElementById("selectedQty").value);
  if(!product || product.stock<qty) return showToast("الكمية غير متوفرة");
  const existing = cart.find(i=>i.id===id && i.color===color && i.size===size);
  if(existing){ existing.qty += qty; } 
  else { cart.push({id, name:product.name, price:product.price, qty, color, size}); }
  product.stock -= qty;
  showToast("تمت الإضافة للسلة");
  renderProducts(productsData);
  productDetailDiv.style.display="none";
}

// ===== السلة =====
function openCart(){
  cartList.innerHTML="";
  let total=0;
  cart.forEach((item,index)=>{
    const li = document.createElement("li");
    li.innerHTML=`${item.name} x${item.qty} - ${item.price*item.qty} ر.ع <button onclick="removeFromCart(${index})">حذف</button>`;
    cartList.appendChild(li);
    total += item.price*item.qty;
  });
  const totalLi = document.createElement("li");
  totalLi.innerHTML=`<b>المجموع: ${total} ر.ع</b>`;
  cartList.appendChild(totalLi);
  cartPopup.style.display="block";
}

function removeFromCart(index){
  const item = cart[index];
  const product = productsData.find(p=>p.id===item.id);
  if(product) product.stock += item.qty;
  cart.splice(index,1);
  openCart();
}

// ===== إشعارات =====
function showToast(msg){
  toastDiv.innerText = msg;
  toastDiv.style.display="block";
  setTimeout(()=>toastDiv.style.display="none",2000);
}

// ===== تكبير الصورة =====
function zoomImage(src){
  const zoomDiv = document.createElement("div");
  zoomDiv.style.position="fixed";
  zoomDiv.style.top="0";
  zoomDiv.style.left="0";
  zoomDiv.style.width="100%";
  zoomDiv.style.height="100%";
  zoomDiv.style.background="rgba(0,0,0,0.8)";
  zoomDiv.style.display="flex";
  zoomDiv.style.alignItems="center";
  zoomDiv.style.justifyContent="center";
  zoomDiv.style.zIndex="9999";
  zoomDiv.innerHTML = `<img src="${src}" style="max-width:90%; max-height:90%;"><button style="position:absolute;top:20px;right:20px;font-size:20px;" onclick="this.parentElement.remove()">✖</button>`;
  document.body.appendChild(zoomDiv);
}

// ===== بدء التشغيل =====
renderProducts(productsData);
</script>

</body>
</html>
