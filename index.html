<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجري للملابس النسائية</title>

<style>
/* ===================== الجسم والخلفية ===================== */
body {
  margin:0;
  font-family: 'Segoe UI', Tahoma;
  background:#f5f5f5;
}

/* ===================== الحاوية ===================== */
.container{
  padding:15px;
  padding-bottom:90px;
}

/* ===================== التبويبات ===================== */
.top-tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:10px;
}
.top-tabs button{
  border:none;
  padding:8px 16px;
  border-radius:20px;
  background:#eee;
  font-size:14px;
  cursor:pointer;
}
.top-tabs .active{
  background:#000;
  color:#fff;
}

/* ===================== شريط العروض ===================== */
#offerBar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  background:#ffcc00;
  color:#000;
  font-weight:bold;
  border-radius:5px;
  margin-bottom:10px;
}
#offerBar #offerContent{
  display:flex;
  align-items:center;
  overflow:hidden;
  flex:1;
}
#offerBar img{
  height:50px;
  border-radius:5px;
  margin-right:10px;
}
#offerBar span{
  white-space:nowrap;
}
#offerBar button{
  border:none;
  background:none;
  font-weight:bold;
  cursor:pointer;
  font-size:18px;
}

/* ===================== شريط السلة ===================== */
#cartSummary{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#ff5722;
  color:white;
  font-weight:bold;
  border-radius:5px;
  margin-bottom:10px;
  cursor:pointer;
}

/* ===================== البحث ===================== */
.search-bar input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:10px;
}

/* ===================== التصنيف والفلاتر ===================== */
.sort-filter-bar{
  display:flex;
  justify-content:space-around;
  background:#222;
  color:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}
.sort-filter-bar button{
  background:none;
  border:none;
  color:white;
  font-size:14px;
  cursor:pointer;
}

/* ===================== المنتجات ===================== */
.products{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}
.product{
  width:48%;
  background:white;
  border-radius:15px;
  padding:10px;
  position:relative;
  transition:transform 0.2s, box-shadow 0.2s;
}
.product:hover{
  transform:scale(1.05);
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}
.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}
.heart{
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  border-radius:50%;
  padding:6px;
  cursor:pointer;
  font-size:18px;
}
.product h4{
  margin:8px 0 5px;
  font-size:14px;
}
.price{
  font-weight:bold;
}
.add-btn{
  width:100%;
  margin-top:5px;
  border:none;
  padding:8px;
  background:#ff5722;
  color:white;
  border-radius:20px;
  cursor:pointer;
  transition: transform 0.2s;
}
.add-btn:hover{
  transform:scale(1.05);
}

/* ===================== نافذة السلة ===================== */
.cart-popup, #authPopup, #adminLogin, #adminPanel{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  width:90%;
  max-width:350px;
  border-radius:15px;
  padding:15px;
  display:none;
  z-index:2000;
}
.cart-popup ul, #authPopup ul{
  list-style:none;
  padding:0;
}
.cart-popup li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.cart-item-controls{
  display:flex;
  gap:5px;
  align-items:center;
}
.cart-item-controls button{
  padding:2px 6px;
  border:none;
  border-radius:5px;
  background:#ff5722;
  color:white;
  cursor:pointer;
}
.cart-total{
  font-weight:bold;
  margin-top:10px;
  text-align:right;
}

/* ===================== شريط السفلي ===================== */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #ddd;
}
.bottom-nav button{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:14px;
  cursor:pointer;
}

/* ===================== إشعارات ===================== */
#toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  display:none;
  z-index:2000;
}

/* ===================== الحماية من الشاشات الصغيرة ===================== */
@media (max-width:600px){
  .product{ width:100%; }
  .top-tabs{ flex-wrap:wrap; }
}
</style>
</head>

<body>

<div class="container">

  <!-- التبويبات -->
  <div class="top-tabs">
    <button class="active" data-category="omani">عمانية</button>
    <button data-category="blushi">بلوشي</button>
    <button data-category="pieces">قطع بلوشي</button>
  </div>

  <!-- شريط العروض -->
  <div id="offerBar">
    <div id="offerContent">
      <img id="offerImg" src="" alt="عرض">
      <span id="offerText"></span>
    </div>
    <button onclick="document.getElementById('offerBar').style.display='none'">❌</button>
  </div>

  <!-- شريط السلة -->
  <div id="cartSummary">
    <span id="cartCount">0 عناصر</span>
    <span id="cartTotalSummary">0 ر.ع</span>
    <button onclick="payNow()" style="background:#4caf50; border:none; padding:5px 10px; border-radius:10px; color:white;">💳 دفع</button>
  </div>

  <!-- البحث -->
  <div class="search-bar">
    <input type="text" id="search" placeholder="ابحث">
  </div>

  <!-- التصنيف والفلاتر -->
  <div class="sort-filter-bar">
    <button onclick="showToast('التصنيف قريباً')">⇅ تصنيف</button>
    <button onclick="showToast('التصفية قريباً')">☰ تصفية</button>
  </div>

  <!-- المنتجات -->
  <div class="products" id="products"></div>
</div>

<!-- نافذة السلة -->
<div class="cart-popup" id="cartPopup">
  <h3>سلة التسوق</h3>
  <ul id="cartList"></ul>
  <div class="cart-total" id="cartTotal">الإجمالي: 0 ر.ع</div>
  <button onclick="cartPopup.style.display='none'">إغلاق</button>
</div>

<!-- تسجيل المستخدم -->
<div id="authPopup">
  <h3 id="authTitle">تسجيل الدخول</h3>
  <input type="text" id="authName" placeholder="الاسم" style="display:none;">
  <input type="email" id="authEmail" placeholder="البريد الإلكتروني">
  <input type="password" id="authPassword" placeholder="كلمة المرور">
  <button id="authBtn">دخول</button>
  <p id="toggleAuth">ليس لديك حساب؟ سجل الآن</p>
</div>

<!-- تسجيل التاجر -->
<div id="adminLogin">
  <h3>دخول التاجر</h3>
  <input type="password" id="adminPass" placeholder="الرقم السري">
  <button onclick="loginAdmin()">دخول</button>
</div>

<!-- لوحة التاجر -->
<div id="adminPanel">
  <h3>لوحة تحكم التاجر</h3>
  <input id="pName" placeholder="اسم المنتج">
  <input id="pPrice" type="number" placeholder="السعر">
  <input id="pImg" placeholder="رابط الصورة">
  <select id="pCat">
    <option value="omani">عمانية</option>
    <option value="blushi">بلوشي</option>
    <option value="pieces">قطع بلوشي</option>
  </select>
  <button onclick="addProduct()">➕ إضافة منتج</button>
  <hr>
  <div id="adminProducts"></div>
  <button onclick="logoutAdmin()">خروج</button>
</div>

<!-- شريط السفلي -->
<div class="bottom-nav">
  <button>🏠<span>الرئيسية</span></button>
  <button>📂<span>الفئات</span></button>
  <button>🔥<span>تخفيضات</span></button>
  <button onclick="openCart()">🛒<span>السلة</span></button>
  <button onclick="openAuth(false)"><span id="accountName">حسابي</span></button>
  <button onclick="openAdminLogin()">🛠️<span>تاجر</span></button>
</div>

<div id="toast"></div>

<script>
// ------------------ البيانات ------------------
let productsData = JSON.parse(localStorage.getItem("products")) || [
  {name:"عباية عمانية سوداء",price:80,img:"https://i.imgur.com/0y8Ftya.jpg",category:"omani"},
  {name:"فستان بلوشي مطرز",price:95,img:"https://i.imgur.com/Yx8FqPz.jpg",category:"blushi"},
  {name:"قطعة بلوشية",price:40,img:"https://i.imgur.com/1bX5QH6.jpg",category:"pieces"}
];
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let currentUser = JSON.parse(localStorage.getItem("currentUser"))||null;
const ADMIN_PASSWORD = "1234";
let isAdmin = false;

// ------------------ عناصر DOM ------------------
const productsDiv = document.getElementById("products");
const cartPopup = document.getElementById("cartPopup");
const cartList = document.getElementById("cartList");
const cartTotal = document.getElementById("cartTotal");
const cartCount = document.getElementById("cartCount");
const searchInput = document.getElementById("search");
const authPopup = document.getElementById("authPopup");
const authName = document.getElementById("authName");
const authEmail = document.getElementById("authEmail");
const authPassword = document.getElementById("authPassword");
const authBtn = document.getElementById("authBtn");
const toggleAuth = document.getElementById("toggleAuth");
const accountBtn = document.getElementById("accountName");
const offerBar = document.getElementById("offerBar");
const offerText = document.getElementById("offerText");
const offerImg = document.getElementById("offerImg");
const tabButtons = document.querySelectorAll(".top-tabs button");
const adminLogin = document.getElementById("adminLogin");
const adminPanel = document.getElementById("adminPanel");

let currentCategory = "omani";

// ------------------ الوظائف ------------------
function saveProducts(){ localStorage.setItem("products",JSON.stringify(productsData)); }
function showToast(msg){ const t=document.getElementById("toast"); t.innerText=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",2000); }

function renderProducts(list){
  productsDiv.innerHTML="";
  list.forEach(p=>{
    const div=document.createElement("div");
    div.className="product";
    div.innerHTML=`
      <div class="heart">♡</div>
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <div class="price">${p.price} ر.ع</div>
      <button class="add-btn">أضف للسلة</button>
    `;
    const heart = div.querySelector(".heart");
    heart.addEventListener("click",()=>{ heart.innerText=heart.innerText==="♡"?"❤️":"♡"; showToast(heart.innerText==="❤️"?"تمت الإضافة للمفضلة":"تمت الإزالة من المفضلة"); });
    div.querySelector(".add-btn").addEventListener("click",()=>{ addToCart(p.name,p.price); });
    productsDiv.appendChild(div);
  });
}

function addToCart(name,price){
  if(!currentUser){ showToast("سجل دخولك أولاً"); return; }
  const existing=cart.find(i=>i.name===name);
  if(existing){ existing.qty+=1; }else{ cart.push({name,price,qty:1}); }
  updateCart();
  showToast("تمت الإضافة للسلة");
}

function updateCart(){
  cartList.innerHTML="";
  let total=0,totalQty=0;
  cart.forEach(i=>{
    total+=i.price*i.qty;
    totalQty+=i.qty;
    const li=document.createElement("li");
    li.innerHTML=`${i.name} <div class="cart-item-controls"><button onclick="changeQty('${i.name}',-1)">-</button><span>${i.qty}</span><button onclick="changeQty('${i.name}',1)">+</button><button onclick="removeItem('${i.name}')">🗑️</button><span>${(i.price*i.qty).toFixed(2)} ر.ع</span></div>`;
    cartList.appendChild(li);
  });
  cartTotal.innerText="الإجمالي: "+total.toFixed(2)+" ر.ع";
  cartCount.innerText=`${totalQty} عناصر`;
}

function changeQty(name,delta){ const item=cart.find(i=>i.name===name); if(!item)return; item.qty+=delta; if(item.qty<1) removeItem(name); updateCart(); }
function removeItem(name){ cart=cart.filter(i=>i.name!==name); updateCart(); }

function openCart(){ updateCart(); cartPopup.style.display="block"; }
function payNow(){ if(!currentUser){ showToast("سجل دخولك"); return;} if(cart.length===0){ showToast("السلة فارغة"); return;} cart=[]; updateCart(); showToast("تم الدفع ✅"); }

tabButtons.forEach(btn=>{
  btn.addEventListener("click",()=>{
    tabButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentCategory=btn.dataset.category;
    searchInput.value="";
    renderProducts(productsData.filter(p=>p.category===currentCategory));
  });
});

searchInput.addEventListener("input",()=>{
  const q=searchInput.value.toLowerCase();
  renderProducts(productsData.filter(p=>p.category===currentCategory && p.name.toLowerCase().includes(q)));
});

// تسجيل الدخول/التسجيل
let isRegister=false;
function openAuth(register=false){
  isRegister=register;
  authPopup.style.display="block";
  authName.style.display=register?"block":"none";
  authBtn.innerText=register?"سجل الآن":"دخول";
  toggleAuth.innerText=register?"لديك حساب؟ سجل الدخول":"ليس لديك حساب؟ سجل الآن";
}
toggleAuth.addEventListener("click",()=>openAuth(!isRegister));
authBtn.addEventListener("click",()=>{
  const email=authEmail.value.trim();
  const password=authPassword.value.trim();
  const name=authName.value.trim();
  let users=JSON.parse(localStorage.getItem("users")||"[]");
  if(isRegister){
    if(!name||!email||!password){ showToast("املأ جميع الحقول"); return; }
    if(users.find(u=>u.email===email)){ showToast("البريد مستخدم مسبقاً"); return; }
    users.push({name,email,password});
    localStorage.setItem("users",JSON.stringify(users));
    currentUser={name,email}; localStorage.setItem("currentUser",JSON.stringify(currentUser));
    accountBtn.innerText=name; showToast("تم التسجيل"); authPopup.style.display="none";
  } else {
    const user=users.find(u=>u.email===email && u.password===password);
    if(user){ currentUser={name:user.name,email:user.email}; localStorage.setItem("currentUser",JSON.stringify(currentUser)); accountBtn.innerText=user.name; showToast("تم تسجيل الدخول"); authPopup.style.display="none"; }
    else showToast("خطأ في البريد أو كلمة المرور");
  }
});

if(currentUser) accountBtn.innerText=currentUser.name;
document.querySelector(".bottom-nav button:nth-child(5)").addEventListener("click",()=>{
  if(currentUser){ if(confirm("تسجيل الخروج؟")){ localStorage.removeItem("currentUser"); currentUser=null; accountBtn.innerText="حسابي"; } } else openAuth(false);
});

// التاجر
function openAdminLogin(){ adminLogin.style.display="block"; }
function loginAdmin(){ const pass=document.getElementById("adminPass").value; if(pass===ADMIN_PASSWORD){ isAdmin=true; adminLogin.style.display="none"; adminPanel.style.display="block"; renderProducts(productsData); showToast("تم دخول التاجر"); } else showToast("كلمة المرور خاطئة"); }
function logoutAdmin(){ isAdmin=false; adminPanel.style.display="none"; }

renderProducts(productsData);
updateCart();
</script>
</body>
</html>
