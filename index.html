<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>متجر الملابس النسائية</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ملف التنسيق -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- زر السلة -->
  <button id="cartButton">
    🛒 السلة (<span id="cartCount">0</span>)
  </button>

  <!-- الحاوية -->
  <div class="container">

    <!-- الشعار -->
    <img src="images/logo.png" alt="الشعار" class="logo">

    <!-- الفلاتر -->
    <div class="filters">
      <button onclick="filterCategory('all')">الكل</button>
      <button onclick="filterCategory('نسائي')">نسائي</button>
    </div>

    <!-- البحث -->
    <input type="text" id="search" placeholder="ابحث عن منتج...">

    <!-- المنتجات -->
    <div id="products" class="products"></div>

    <!-- تفاصيل المنتج -->
    <div id="productDetail" class="product-detail" style="display:none;"></div>

    <!-- تسجيل المستخدم -->
    <div id="userLoginDiv">
      <h3>تسجيل الدخول / إنشاء حساب</h3>
      <input id="fullName" placeholder="الاسم الكامل">
      <input id="username" placeholder="اسم المستخدم">
      <input id="userEmail" placeholder="البريد الإلكتروني">
      <input id="userPassword" type="password" placeholder="كلمة المرور">
      <button onclick="registerUser()">إنشاء حساب</button>
      <button onclick="loginUser()">تسجيل دخول</button>
      <p id="userMsg"></p>
    </div>

    <!-- بعد تسجيل الدخول -->
    <div id="welcomeUser" style="display:none;">
      <h3>مرحباً <span id="usernameDisplay"></span> 👋</h3>
      <button onclick="logoutUser()">تسجيل الخروج</button>
      <div id="myOrders"></div>
    </div>

    <hr>

    <!-- دخول التاجر -->
    <div id="loginDiv">
      <h3>دخول التاجر</h3>
      <input type="password" id="adminPassword" placeholder="كلمة المرور">
      <button onclick="loginAsAdmin()">دخول</button>
      <p id="loginMsg"></p>
    </div>

    <!-- لوحة التاجر -->
    <div id="adminDiv" style="display:none;">
      <h3>لوحة تحكم التاجر</h3>

      <input id="newName" placeholder="اسم المنتج">
      <input id="newPrice" type="number" placeholder="السعر">
      <input id="newImage" placeholder="رابط الصورة">
      <input id="newCategory" placeholder="التصنيف">
      <input id="newDelivery" type="number" placeholder="مدة التوصيل">
      <input id="newColors" placeholder="الألوان (مفصولة بفاصلة)">
      <input id="newSizes" placeholder="المقاسات (مفصولة بفاصلة)">
      <input id="newStock" type="number" placeholder="المخزون">

      <button onclick="addProduct()">➕ إضافة منتج</button>

      <div id="ordersAdmin"></div>
    </div>

  </div>

  <!-- نافذة السلة -->
  <div class="cart-popup" id="cartPopup" style="display:none;">
    <h3>سلة المشتريات</h3>
    <ul id="cartPopupList"></ul>
    <p id="popupTotal">المجموع: 0 ريال</p>
    <button onclick="payNow()">الدفع الآن</button>
    <button onclick="closeCart()">إغلاق</button>
  </div>

  <!-- الإشعارات -->
  <div id="toast"></div>

  <!-- ملف الجافاسكربت -->
  <script src="script.js"></script>

</body>
</html>
